{{- if .Values.configBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cordum.fullname" . }}-config-bootstrap
  labels:
    {{- include "cordum.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "cordum.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: config-bootstrap
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ .Values.configBootstrap.image }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CORDUM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cordum.fullname" . }}-secrets
                  key: apiKey
            # Same name and trust as the dashboard proxy: with TLS, verify the
            # gateway against clientCertSecret's ca.crt, else encrypt only.
            - name: GATEWAY_URL
              value: {{ printf "%s://%s-api-gateway.%s.svc.cluster.local:%d" (ternary "https" "http" .Values.global.tls.enabled) (include "cordum.fullname" .) .Release.Namespace (int .Values.gateway.service.httpPort) | quote }}
            {{- if .Values.global.tls.enabled }}
            - name: CURL_TLS_OPTS
              value: {{ ternary "--cacert /etc/cordum/tls/ca/ca.crt" "--insecure" (not (empty .Values.global.tls.clientCertSecret)) | quote }}
            {{- end }}
            - name: MAX_RETRIES
              value: {{ .Values.configBootstrap.retries | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for gateway to become ready..."
              attempt=0
              while [ "$attempt" -lt "$MAX_RETRIES" ]; do
                attempt=$((attempt + 1))
                # CURL_TLS_OPTS is unquoted on purpose: it holds flag words.
                status=$(curl -s $CURL_TLS_OPTS -o /dev/null -w '%{http_code}' \
                  -H "X-API-Key: $CORDUM_API_KEY" \
                  -H "X-Tenant-ID: default" \
                  "$GATEWAY_URL/api/v1/config" 2>/dev/null || echo "000")
                if [ "$status" = "200" ]; then
                  echo "Config endpoint returned 200 — bootstrap complete."
                  exit 0
                fi
                echo "Attempt $attempt/$MAX_RETRIES: status=$status, retrying in 4s..."
                sleep 4
              done
              echo "ERROR: Gateway config endpoint not reachable after $MAX_RETRIES attempts."
              exit 1
          {{- if and .Values.global.tls.enabled .Values.global.tls.clientCertSecret }}
          volumeMounts:
            - name: gateway-ca
              mountPath: /etc/cordum/tls/ca
              readOnly: true
          {{- end }}
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
      {{- if and .Values.global.tls.enabled .Values.global.tls.clientCertSecret }}
      volumes:
        - name: gateway-ca
          secret:
            secretName: {{ .Values.global.tls.clientCertSecret }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
{{- end }}
