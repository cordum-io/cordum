# Safety policy for the LangChain guard tutorial.
#
# Load into Cordum:
#   curl -X POST http://localhost:8081/api/v1/policies \
#     -H "X-API-Key: $CORDUM_API_KEY" \
#     -H "X-Tenant-ID: default" \
#     -H "Content-Type: application/json" \
#     -d @- <<'EOF'
#   {
#     "id": "financial_ops",
#     "name": "Financial Operations Policy",
#     "content": "<paste this YAML>"
#   }
#   EOF

version: "1"
rules:
  # Rule 1: Block all destructive operations. Match conditions are ANDed, so
  # this matches on the capability alone: agent_guarded.py tags every tool
  # "financial", never "destructive".
  - id: no-destructive-ops
    match:
      capabilities: [delete_account]
    decision: deny
    reason: "Destructive operations are blocked by policy."

  # Rule 2: Large transfers require human approval. label_threshold matches
  # when the request label "amount" is a number above 10000, so the caller
  # must send the transfer amount as that label.
  - id: financial-approval
    match:
      capabilities: [transfer_funds]
      label_threshold:
        amount: 10000
    decision: require_approval
    reason: "Transfers over $10,000 require human approval."

  # Rule 3: Everything else is allowed
  - id: default-allow
    match: {}
    decision: allow
    reason: "Default allow for safe operations."
