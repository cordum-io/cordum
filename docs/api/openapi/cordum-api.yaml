    # The gateway registers this path with mux.HandleFunc("/api/v1/stream", ...)
    # — i.e. without a method prefix, so every HTTP verb forwards to the
    # WebSocket upgrader. x-any-method: true tells the openapi-audit tool not
    # to flag the route as uncovered just because the GET stanza below is the
    # only one that renders nicely in redocly.
