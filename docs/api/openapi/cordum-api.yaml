    get:
      operationId: getMCPUsage
      summary: MCP tool-usage heatmap
      description: |
        Aggregates MCP tool calls in the tenant audit chain into a
        per-(agent_id, tool_name) heatmap. Source events are
        `mcp.tool_invocation`, `mcp.tool_denied`, and
        `mcp.tool_approval`. Default window is the last 7 days; the
        request may narrow with `since`/`until` (max 30-day spread).
      tags: [MCP]
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: since
        in: query
        required: false
        description: Inclusive lower bound (unix milliseconds).
        schema:
          type: integer
          format: int64
      - name: until
        in: query
        required: false
        description: Inclusive upper bound (unix milliseconds).
        schema:
          type: integer
          format: int64
      - name: agent
        in: query
        required: false
        description: Filter to a single agent identifier.
        schema:
          type: string
      - name: tool
        in: query
        required: false
        description: Filter to a single MCP tool name.
        schema:
          type: string
      responses:
        '200':
          description: Heatmap aggregation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPUsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
