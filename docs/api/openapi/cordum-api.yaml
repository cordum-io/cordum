  /api/v1/mcp/approvals/{id}/approve:
    post:
      operationId: approveMCPApproval
      summary: Approve an MCP per-tool approval
      description: |
        Resolves the approval as `approved`. The caller's composite
        identity (API-key hash + principal) must not overlap the
        approval's Requester — a self-approval guard rejects with 403.
      tags: [MCP]
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPApprovalDecisionBody'
      responses:
        '200':
          description: Approval resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPApprovalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Approval already resolved (terminal state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/mcp/approvals/{id}/reject:
    post:
      operationId: rejectMCPApproval
      summary: Reject an MCP per-tool approval
      tags: [MCP]
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPApprovalDecisionBody'
      responses:
        '200':
          description: Approval resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPApprovalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Approval already resolved (terminal state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/agents/{id}/denied-events:
    get:
      operationId: getAgentDeniedEvents
      summary: Recent MCP tool-deny events for an agent identity
      description: Returns up to 50 most recent mcp.tool_denied ring-buffer
        entries for the identity. The ring is in-memory and bounded; older
        entries are dropped. The authoritative record is in the SIEM export.
      tags: [Agents]
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recent deny events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeniedEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key issued by the Cordum admin.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v1/auth/login.
  parameters:
    TenantID:
      name: X-Tenant-ID
      in: header
      required: true
      description: Tenant isolation header (required on all protected routes).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency key for safe retries.
      schema:
        type: string
        format: uuid
    JobID:
      name: id
      in: path
      required: true
      description: Job ID
      schema:
        type: string
    WorkflowID:
      name: id
      in: path
      required: true
      description: Workflow ID
      schema:
        type: string
    RunID:
      name: id
      in: path
      required: true
      description: Workflow run ID
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: string
    RoleName:
      name: name
      in: path
      required: true
      schema:
        type: string
    WorkerID:
      name: id
      in: path
      required: true
      schema:
        type: string
    WorkerCredentialID:
      name: worker_id
      in: path
      required: true
      schema:
        type: string
    PoolName:
      name: name
      in: path
      required: true
      schema:
        type: string
    TopicName:
      name: name
      in: path
      required: true
      schema:
        type: string
    TopicPath:
      name: topic
      in: path
      required: true
      schema:
        type: string
    HoldID:
      name: id
      in: path
      required: true
      schema:
        type: string
    LimitQ:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ForceQ:
      name: force
      in: query
      required: false
      schema:
        type: boolean
        default: false
    TenantQ:
      name: tenant
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request — invalid or missing parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden — insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict — resource state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests — rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Bad gateway — upstream service error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TierLimit:
      description: Forbidden by current license entitlements
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
  schemas:
    GovernanceHealth:
      type: object
      description: |
        Composite governance health score for a tenant. Returned by
        GET /api/v1/governance/health.
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Weighted total (0-100). 100 is cleanest. Capped at 55 when chain_integrity=compromised.
        grade:
          type: string
          enum: [A, B, C, D, F]
          description: Letter grade derived from score. 90+→A, 80+→B, 70+→C, 60+→D, else F.
        generated_at:
          type: string
          format: date-time
          description: Timestamp at which the score was computed. 60s cache TTL per-tenant.
        factors:
          type: object
          description: Per-factor breakdown. Keys are one of `denial_rate`, `approval_latency_p95`, `policy_coverage`, `chain_integrity`.
          additionalProperties:
            $ref: '#/components/schemas/GovernanceHealthFactor'
        truncated_at_max:
          type: boolean
          description: True when any underlying factor scan hit its hard cap (approximate result).
      required: [score, grade, generated_at, factors]
    GovernanceHealthFactor:
      type: object
      description: One factor's contribution to the governance health score.
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Factor's 0-100 score. 70 is the neutral default for missing/unavailable inputs.
        weight:
          type: number
          format: double
          description: Factor's weight in the aggregate (default 25 for each of the 4 factors).
        raw:
          description: Factor-specific raw measurement (rate, duration, ratio, status enum).
        notes:
          type: string
          description: Operator-facing explanation when the factor is unavailable or neutralised.
      required: [score, weight]
    AgentIdentity:
      type: object
      description: |
        Non-human actor registered in the platform. Wire shape is produced
        by `agentResponseFromIdentity` in core/controlplane/gateway/handlers_agents.go.
        The `last_active` field is only set on list responses, computed
        from recent job labels.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        team:
          type: string
        risk_tier:
          type: string
          description: Risk tier assigned to the identity. Filters which
            tools it may invoke via MCP.
        allowed_topics:
          type: array
          items:
            type: string
        allowed_pools:
          type: array
          items:
            type: string
        allowed_tools:
          type: array
          items:
            type: string
          description: Tool-name glob patterns admitted for this identity.
            Empty slice means "no tools"; `*` admits every tool.
        data_classifications:
          type: array
          items:
            type: string
          description: Sensitivities the actor is authorised to access
            (e.g. `pii`, `phi`, `secrets`).
        status:
          type: string
          description: Lifecycle status. Typical values include `active`,
            `suspended`, `revoked`.
        created_at:
          type: string
          description: RFC 3339 creation timestamp.
        updated_at:
          type: string
          description: RFC 3339 last-update timestamp.
        last_active:
          type: integer
          format: int64
          description: UnixMicro timestamp of the most recent job labelled
            with this agent in the last 7 days. Present on list responses
            only; 0 when no recent activity.
      required: [id, name, owner, risk_tier, status, created_at, updated_at]
    AgentIdentityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentIdentity'
        cursor:
          type: string
          description: Opaque forward cursor. Absent when there are no more
            pages (not returned as an empty string).
      required: [items]
    CreateAgentRequest:
      type: object
      description: Body of POST /api/v1/agents. Omitted array fields default
        to the empty list; the server strips leading/trailing whitespace
        from every string before validation.
      properties:
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        team:
          type: string
        risk_tier:
          type: string
        allowed_topics:
          type: array
          items:
            type: string
        allowed_pools:
          type: array
          items:
            type: string
        allowed_tools:
          type: array
          items:
            type: string
        data_classifications:
          type: array
          items:
            type: string
      required: [name, owner, risk_tier]
    UpdateAgentRequest:
      type: object
      description: Body of PUT /api/v1/agents/{id}. All fields optional;
        fields present on the body replace the stored values, fields
        omitted leave the stored values untouched.
      properties:
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        team:
          type: string
        risk_tier:
          type: string
        status:
          type: string
        allowed_topics:
          type: array
          items:
            type: string
        allowed_pools:
          type: array
          items:
            type: string
        allowed_tools:
          type: array
          items:
            type: string
        data_classifications:
          type: array
          items:
            type: string
    AgentStats:
      type: object
      description: 7-day aggregate statistics for an agent identity.
      properties:
        agent_id:
          type: string
        total_jobs_7d:
          type: integer
          description: Jobs labelled with this agent_id over the trailing
            7 days. Scan is bounded; the `last_active` field is computed
            from the same scan.
        denied_7d:
          type: integer
          description: Subset of `total_jobs_7d` whose state is `Denied`.
        last_active:
          type: integer
          format: int64
          description: UnixMicro timestamp of the most recent job in the
            window. 0 when no recent activity.
      required: [agent_id, total_jobs_7d, denied_7d, last_active]
    AgentToolVisibility:
      type: object
      description: Subset of the MCP tool catalogue visible to an identity.
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPTool'
        agent_id:
          type: string
        filtered:
          type: boolean
          description: True when the tools list was filtered by the
            identity's allowed_tools / risk_tier / data_classifications.
            False when the caller requested the unfiltered admin view.
        note:
          type: string
          description: Present when the identity cannot invoke any tool —
            e.g. "identity is revoked or suspended".
      required: [tools, agent_id, filtered]
    AgentDeniedEvent:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        agent_id:
          type: string
        tool_name:
          type: string
        sub_reason:
          type: string
          description: Sub-reason from the underlying mcp.tool_denied event,
            falling back to the top-level `reason` when no sub_reason was
            attached.
        severity:
          type: string
      required: [timestamp, agent_id, tool_name, sub_reason, severity]
    AgentDeniedEvents:
      type: object
      properties:
        agent_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentDeniedEvent'
        limit:
          type: integer
          description: Max entries the endpoint will return (currently 50).
      required: [agent_id, events, limit]
    AuditVerifyResult:
      type: object
      description: Integrity report for /api/v1/audit/verify. Shape matches
        `core/audit.VerifyResult`.
      properties:
        status:
          type: string
          enum: [ok, partial, compromised]
        total_events:
          type: integer
        verified_events:
          type: integer
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/AuditVerifyGap'
        retention_boundary_seq:
          type: integer
          format: int64
        retention_window_hours:
          type: number
          format: double
        first_seq:
          type: integer
          format: int64
        last_seq:
          type: integer
          format: int64
      required: [status, total_events, verified_events, gaps, retention_boundary_seq]
    AuditVerifyGap:
      type: object
      properties:
        at_seq:
          type: integer
          format: int64
        type:
          type: string
          description: Gap classification — `retention_trimmed` or `missing`.
      required: [at_seq, type]
    MCPVerifySignatureRequest:
      type: object
      description: Submit the method, params, and the 6 signed headers the
        original Signer emitted. The server rebuilds the canonical message.
      properties:
        method:
          type: string
        params:
          description: Raw JSON params from the original request.
        headers:
          type: object
          additionalProperties:
            type: string
      required: [method, headers]
    MCPVerifySignatureResponse:
      type: object
      properties:
        ok:
          type: boolean
        sub_reason:
          type: string
          description: Stable machine-readable reason when verification
            failed (absent on success).
        key_id:
          type: string
        tenant:
          type: string
        agent_id:
          type: string
      required: [ok]
    MCPApprovalRecord:
      type: object
      properties:
        id:
          type: string
        tenant:
          type: string
        agent_id:
          type: string
        principal:
          type: string
        tool_name:
          type: string
        args_hash:
          type: string
        args:
          description: Raw JSON arguments (may be redacted per policy).
        requester:
          type: string
        reason:
          type: string
        resolution_reason:
          type: string
        status:
          type: string
          description: Approval status — pending, approved, rejected, expired.
        created_at:
          type: integer
          format: int64
          description: UnixMicro creation timestamp.
        expires_at:
          type: integer
          format: int64
        resolved_at:
          type: integer
          format: int64
        resolved_by:
          type: string
        decision:
          type: string
          description: Final decision when resolved — approve, reject.
        consumed_at:
          type: integer
          format: int64
      required: [id, tenant, agent_id, tool_name, args_hash, status, created_at, expires_at]
    MCPApprovalList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MCPApprovalRecord'
        next_cursor:
          type: string
          description: Opaque scan cursor. "0" is the end-of-scan sentinel.
      required: [items, next_cursor]
    MCPApprovalDecisionBody:
      type: object
      description: Optional body for approve/reject. The `reason` field is
        stored on the record as `resolution_reason`.
      properties:
        reason:
          type: string
    MCPUsageCell:
      type: object
      description: |
        One bucket in the MCP usage heatmap, keyed by (agent_id, tool_name).
      properties:
        agent_id:
          type: string
        tool_name:
          type: string
        count:
          type: integer
          description: Total invocation events seen for this bucket.
        allow_count:
          type: integer
          description: Count of events with decision == "allow".
        deny_count:
          type: integer
          description: Count of events with decision == "deny" or event_type ==
            mcp.tool_denied.
        approval_required_count:
          type: integer
          description: Count of events whose Extra.approval_status was
            "required" or "pending".
        p50_latency_ms:
          type: number
          description: Median observed latency from Extra.latency_ms.
        p99_latency_ms:
          type: number
          description: p99 observed latency from Extra.latency_ms.
        last_invoked_at_ms:
          type: integer
          format: int64
          description: Most recent event timestamp (unix ms).
      required: [agent_id, tool_name, count, allow_count, deny_count, approval_required_count, p50_latency_ms, p99_latency_ms, last_invoked_at_ms]
    MCPUsageResponse:
      type: object
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/MCPUsageCell'
        total_calls:
          type: integer
        window_ms:
          type: integer
          format: int64
          description: until-since for the evaluated window.
        truncated_at_max:
          type: boolean
          description: True when the per-request walk budget (100k events) was
            hit before the source range was exhausted; counts may be partial.
      required: [cells, total_calls, window_ms, truncated_at_max]
    MCPSignatureStatus:
      type: string
      enum: [verified, unverified, invalid]
      description: |
        Signature verification result for an outbound MCP call. `verified`
        means the signature checked OK against a trusted key. `invalid`
        means the signature was present but rejected (bad signature, untrusted
        key, expired nonce). `unverified` means no signature was emitted —
        either the call predates the signing rollout or signing was disabled.
    MCPOutboundEntry:
      type: object
      properties:
        ts_ms:
          type: integer
          format: int64
        stream_id:
          type: string
          description: Redis Stream ID for this entry. Use as `cursor` to
            resume past it on the next page.
        agent_id:
          type: string
        tool_name:
          type: string
        target_server:
          type: string
        signature_status:
          $ref: '#/components/schemas/MCPSignatureStatus'
        signature_key_id:
          type: string
        latency_ms:
          type: integer
        result_type:
          type: string
        event_hash:
          type: string
      required: [ts_ms, stream_id, agent_id, tool_name, target_server, signature_status]
    MCPOutboundResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MCPOutboundEntry'
        next_cursor:
          type: string
          description: Pass back as `cursor=` to fetch the next page. Empty when
            the range is exhausted.
        truncated_at_max:
          type: boolean
          description: True when the per-request walk budget (50k entries) was
            hit before the page filled.
      required: [entries, truncated_at_max]
    StreamEvent:
      type: object
      description: |
        One WebSocket frame emitted by GET /api/v1/stream. The wire shape is
        `protojson.Marshal(BusPacket)` — the `type` field below is a derived
        discriminator exposed to dashboards via `busPacketType()` in
        core/controlplane/gateway/handlers_stream.go. Frames corresponding
        to denied job results have their result payload stripped to avoid
        broadcasting sensitive content.
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
          - job_request
          - job_result
          - heartbeat
          - alert
          - job_progress
          - job_cancel
          - unknown
        payload:
          description: The inner BusPacket payload variant. Shape depends on
            `type` — see the proto definitions in core/protocol/proto/v1.
      required: [type]
    MCPTool:
      type: object
      description: MCP tool registry entry. Shape mirrors `core/mcp.Tool` —
        additional fields may appear as the registry evolves.
      additionalProperties: true
      properties:
        name:
          type: string
        description:
          type: string
        risk_tier:
          type: string
        data_classifications:
          type: array
          items:
            type: string
      required: [name]
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        status:
          type: integer
          description: HTTP status code
      required:
      - error
      - status
    PaginatedResponse:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page (null if no more pages)
    AuthConfig:
      type: object
      properties:
        password_enabled:
          type: boolean
        user_auth_enabled:
          type: boolean
        saml_enabled:
          type: boolean
        saml_enterprise:
          type: boolean
        saml_login_url:
          type: string
        saml_metadata_url:
          type: string
        oidc_enabled:
          type: boolean
        oidc_issuer:
          type: string
        oidc_login_url:
          type: string
        oidc_client_id:
          type: string
        oidc_redirect_uri:
          type: string
        oidc_scopes:
          type: array
          items:
            type: string
        oidc_client_secret_masked:
          type: string
        session_ttl:
          type: string
        require_rbac:
          type: boolean
        require_principal:
          type: boolean
        default_tenant:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        tenant:
          type: string
      required:
      - username
      - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
      required:
      - current_password
      - new_password
    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        tenant:
          type: string
        roles:
          type: array
          items:
            type: string
        source:
          type: string
          description: Auth source (local, saml, oidc)
        created_at:
          type: string
