  /api/v1/audit/export:
    get:
      operationId: exportAudit
      summary: Stream a compliance audit export with chain verification and SOC2 tags
      description: |
        Streams every SIEMEvent recorded on the tenant's audit chain between `from` and `to`,
        annotated with SOC2 2017 Trust Services Criteria control IDs and a manifest containing
        chain-integrity status + signed policy-bundle snapshots active during the range.

        Format `json` emits NDJSON: the first line is a `type=manifest` record (chain
        verification status, retention boundary, policy snapshots, SOC2 legend), followed
        by one `type=event` record per audit entry, followed by a `type=footer` record.
        Format `csv` emits an RFC 4180 CSV preceded by a `# cordum-manifest: {...}`
        comment line containing the same manifest JSON. When `excel=true` the CSV is
        prefixed with a UTF-8 BOM so Microsoft Excel treats the payload as UTF-8.

        Tenant is always resolved from the caller's auth context. Admin role required.
        Requires either the `siem_export` or `audit_export` entitlement.
      tags:
      - AuditExport
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [json, csv]
          default: json
      - name: from
        in: query
        required: true
        description: RFC 3339 lower bound (inclusive)
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        description: RFC 3339 upper bound (inclusive)
        schema:
          type: string
          format: date-time
      - name: excel
        in: query
        required: false
        description: Prepend a UTF-8 BOM to CSV output so Excel honours UTF-8.
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        description: Cap events emitted; defaults to 1,000,000 for Enterprise / 10,000 for Team.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Streamed audit export.
          headers:
            X-Cordum-Export-Format:
              schema:
                type: string
                enum: [json, csv]
            X-Cordum-Tenant:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="cordum-audit-default-20260101-20260417.ndjson"'
          content:
            application/x-ndjson:
              schema:
                type: string
                description: |
                  One JSON object per line. First object has `type: manifest`; each event
                  has `type: event` plus `soc2_controls` array; trailing object has
                  `type: footer` with `event_count` and `truncated`.
              example: |
                {"type":"manifest","generated_at":"2026-04-18T09:00:00Z","tenant_id":"default","from":"2026-04-01T00:00:00Z","to":"2026-04-17T23:59:59Z","format":"json","chain_verification":{"status":"ok","total_events":42,"verified_events":42,"gaps":[]},"policy_snapshots":[{"bundle_id":"secops/baseline","version":"v3","ed25519_signature":"...","public_key_id":"primary-2026"}],"soc2_legend":{"CC7.2":"Monitoring of controls"},"event_count":0,"truncated_at_max":false}
                {"type":"event","timestamp":"2026-04-01T00:01:00Z","event_type":"safety.decision","severity":"INFO","tenant_id":"default","action":"db.read","decision":"allow","seq":1,"event_hash":"a1b2...","prev_hash":"","soc2_controls":["CC7.2"]}
                {"type":"footer","event_count":42,"truncated":false,"max_events_cap":1000000,"generated_at":"2026-04-18T09:00:00Z"}
            text/csv:
              schema:
                type: string
                description: |
                  RFC 4180 CSV preceded by a `# cordum-manifest: {...}` comment line.
                  21 columns (timestamp, event_type, severity, tenant_id, agent_id,
                  agent_name, agent_risk_tier, job_id, action, decision, matched_rule,
                  reason, risk_tags, capabilities, policy_version, identity, seq,
                  event_hash, prev_hash, soc2_controls, extra_json).
              example: |
                # cordum-manifest: {"type":"manifest","tenant_id":"default","format":"csv","chain_verification":{"status":"ok"}}
                timestamp,event_type,severity,tenant_id,agent_id,agent_name,agent_risk_tier,job_id,action,decision,matched_rule,reason,risk_tags,capabilities,policy_version,identity,seq,event_hash,prev_hash,soc2_controls,extra_json
                2026-04-01T00:01:00Z,safety.decision,INFO,default,,,,,"db.read",allow,,,,,,,1,a1b2...,,CC7.2,
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TierLimit'
        '503':
          description: Audit stream unavailable (Redis not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
