    SignedBundleSnapshot:
      type: object
      description: One signed policy-bundle snapshot active during a compliance export window.
      properties:
        bundle_id:
          type: string
          example: secops/baseline
        name:
          type: string
        version:
          type: string
          example: v3
        activated_at:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
        content_sha256:
          type: string
          description: Hex-encoded SHA-256 of the signed content.
        ed25519_signature:
          type: string
          description: Base64-encoded Ed25519 signature over the content hash.
        public_key_id:
          type: string
        signed_by:
          type: string
        note:
          type: string
          description: Populated (e.g. "unsigned") when signature metadata is absent or malformed.
      required: [bundle_id]
    ExportManifest:
      type: object
      description: First NDJSON line / CSV comment-line payload for a compliance export.
      properties:
        type:
          type: string
          enum: [manifest]
        generated_at:
          type: string
          format: date-time
        tenant_id:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        format:
          type: string
          enum: [json, csv]
        soc2_legend:
          type: object
          additionalProperties:
            type: string
          description: Human-readable descriptions keyed by SOC2 TSC control ID.
        chain_verification:
          description: Result of running audit chain verify against the exported range.
          type: object
          properties:
            status:
              type: string
              enum: [ok, compromised, partial]
            total_events:
              type: integer
            verified_events:
              type: integer
            gaps:
              type: array
              items:
                type: object
                properties:
                  at_seq:
                    type: integer
                  type:
                    type: string
                    enum: [missing, out_of_order, hash_mismatch, retention_trimmed]
            retention_boundary_seq:
              type: integer
            first_seq:
              type: integer
            last_seq:
              type: integer
        policy_snapshots:
          type: array
          items:
            $ref: '#/components/schemas/SignedBundleSnapshot'
        event_count:
          type: integer
        truncated_at_max:
          type: boolean
        max_events_cap:
          type: integer
        retention_boundary_seq:
          type: integer
      required: [type, generated_at, tenant_id, from, to, format, policy_snapshots, event_count]
