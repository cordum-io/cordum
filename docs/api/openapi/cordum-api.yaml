      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  worker_id:
                    type: string
                  tenant:
                    type: string
                  revoked:
                    type: boolean
                required:
                - worker_id
                - tenant
                - revoked
