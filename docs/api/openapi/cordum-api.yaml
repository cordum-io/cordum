    x-websocket: true
    x-websocket-message-schema:
      $ref: '#/components/schemas/StreamEvent'
    get:
      operationId: streamEvents
      summary: WebSocket event bus stream
      description: |
        Upgrades to a WebSocket connection and streams real-time bus packets
        (job state changes, heartbeats, DLQ alerts, workflow progress). The
        HTTP method is ignored; the gateway handler upgrades the connection
        regardless of the verb used.

        Authentication: the caller supplies an `X-Tenant-ID` header (optional
        for superadmin tokens) plus a
        `Sec-WebSocket-Protocol: cordum-api-key, <base64url(api_key)>`
        subprotocol header. Sessions are re-validated on credential rotation.
        Each frame is a JSON-encoded `StreamEvent` — see the schema for the
        enumerated `type` values.
      tags:
      - Streaming
      responses:
        '101':
          description: WebSocket upgrade accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
