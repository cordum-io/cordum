      summary: Aggregated shadow evaluation counts for a bundle
      description: |
        Returns total_evaluated plus per-diff counts (escalated, relaxed,
        approval_differ, unchanged) over the requested [from, to] window.
        Memoised for 60 seconds per (tenant, bundle, window) so dashboard
        polling doesn't re-scan the audit stream. Admin-only; tenant-scoped.
      tags:
      - Policy
      parameters:
      - name: from
        in: query
        required: true
        description: Inclusive window start (unix ms).
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        required: true
        description: Inclusive window end (unix ms). Window must be ≤ 30 days.
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Summary counts
          content:
            application/json:
              schema:
