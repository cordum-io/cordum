  /api/v1/audit/verify:
    get:
      operationId: verifyAuditChain
      summary: Verify the audit chain integrity for a tenant
      description: |
        Walks the tenant's audit chain stream and returns an integrity
        summary: every event's hash and prev-hash are recomputed, gaps
        below the retention boundary are classified `retention_trimmed`,
        gaps at or above are classified `missing` (suspected tampering).
        Never returns raw event bodies — this is an integrity-reporting
        endpoint, not an audit-retrieval endpoint.
      tags: [Audit]
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: tenant
        in: query
        required: false
        description: Tenant to verify. Must resolve to a tenant the caller
          is authorised for; cross-tenant admins may pass any tenant.
        schema:
          type: string
      - name: since
        in: query
        required: false
        description: Unix millisecond lower bound on Redis Stream IDs.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: until
        in: query
        required: false
        description: Unix millisecond upper bound on Redis Stream IDs.
          The since/until range cannot exceed 30 days.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Max events to read (default 10000, hard cap 100000).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Verify result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Audit chainer not installed; verify cannot attest
            integrity. Check boot logs for `audit chain enabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/mcp/tools:
    get:
      operationId: listMCPTools
      summary: List MCP tools
      description: |
        Returns the MCP tool catalogue. Without `agent_id`, returns the
        unfiltered admin view. With `agent_id`, returns the subset that
        identity would see after allowed_tools / risk_tier / data_classifications
        gating.
