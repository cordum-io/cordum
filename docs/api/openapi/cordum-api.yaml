    parameters:
    - name: id
      in: path
      required: true
      description: Bundle id the shadow is evaluated against.
      schema:
        type: string
    - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listShadowResultComparisons
      summary: Paginated individual shadow-vs-active comparisons
      description: |
        Returns one row per shadow_eval event, each carrying active_verdict,
        shadow_verdict, diff, and rule IDs. Uses Redis-stream-id cursor
        pagination: pass the prior response's `next_cursor` as `?cursor=` to
        fetch the next page. Optional `diff` filter narrows the page to a
        single diff class. Admin-only; tenant-scoped; not cached.
      tags:
      - Policy
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: diff
        in: query
        required: false
        description: Filter by diff class.
        schema:
          type: string
          enum: [escalated, relaxed, approval_differ, unchanged, all]
      - name: cursor
        in: query
        required: false
        description: Redis Stream ID to resume from.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size (default 50, max 500).
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Comparison rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowComparisonsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
