      summary: Revoke the active session token for a worker (admin)
      description: |
        Admin-only endpoint that invalidates the worker's active
        Phase-2 session token immediately. Subsequent packets
        carrying that token are rejected by the scheduler's
        session-token middleware. Idempotent — revoking a worker
