      description: |
        Composite governance health metric for the Command Center. Weighted
        aggregate of four factors — denial rate (25%), approval latency p95
        (25%), policy coverage (25%), chain integrity (25%). Scored 0-100
        and mapped to a letter grade (A/B/C/D/F). A compromised audit chain
        caps the overall score at 55 (F) regardless of other factors.
        Single-factor failures do not 500; the factor's Score stays at the
        neutral default with an explanatory `notes` field.
