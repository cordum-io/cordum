  /api/v1/mcp/outbound:
    get:
      operationId: getMCPOutbound
      summary: MCP outbound call log
      description: |
        Paginated feed of `mcp.tool_outbound_invocation` events from
        the tenant audit chain. Each entry carries the signed-call
        signature status (verified / unverified / invalid) so operators
        can spot identity-spoofing attempts. Supports cursor-based
        pagination via the Redis Stream IDs surfaced as `next_cursor`.
      tags: [MCP]
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: since
        in: query
        required: false
        description: Inclusive lower bound (unix milliseconds).
        schema:
          type: integer
          format: int64
      - name: until
        in: query
        required: false
        description: Inclusive upper bound (unix milliseconds).
        schema:
          type: integer
          format: int64
      - name: agent
        in: query
        required: false
        description: Filter to a single agent identifier.
        schema:
          type: string
      - name: server
        in: query
        required: false
        description: Filter to a single target MCP server.
        schema:
          type: string
      - name: sig_status
        in: query
        required: false
        description: Filter by signature verification result.
        schema:
          type: string
          enum: [verified, unverified, invalid, all]
          default: all
      - name: cursor
        in: query
        required: false
        description: Resume token returned as `next_cursor` from a previous page.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size, default 100, max 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Outbound call log page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPOutboundResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/mcp/verify-signature:
    post:
      operationId: verifyMCPSignature
      summary: Verify an outbound MCP call signature
      description: |
        Re-verifies an outbound MCP call signature server-side using the
        gateway's configured trust store. Returns `ok: true` on a clean
        verification, or `ok: false` plus a stable `sub_reason` when any
        step of the signature check fails (missing header, expired nonce,
        bad curve, key not trusted, etc.). Every failed verify emits a
        `mcp.signature_invalid` SIEMEvent on the tenant audit chain.
      tags: [MCP]
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPVerifySignatureRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPVerifySignatureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: MCP verifier unavailable — no trusted public keys
            configured. Set CORDUM_MCP_INBOUND_TRUSTED_KEY_<ID> and restart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/mcp/approvals:
    get:
      operationId: listMCPApprovals
      summary: List MCP per-tool approvals
      description: |
        Returns the tenant-scoped queue of MCP approval records. The
        cursor is an opaque Redis SCAN cursor; `next_cursor: "0"` is the
        end-of-scan sentinel.
