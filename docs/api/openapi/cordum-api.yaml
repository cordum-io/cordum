        schema:
          type: string
      - name: cursor
        in: query
        required: false
        description: Opaque forward cursor. Empty or absent starts at the
          beginning of the scan.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Max records per page (hard cap 200).
        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses:
