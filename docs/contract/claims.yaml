# Claim register: one entry per recorded protection claim, with its status, boundary,
# evidence and public sources, and any invariants, enforcement points and tests.
# Status: planned (not built); supported (the feature exists, but a workload could
# bypass it or it is untested against bypass); enforced (an enforcement point exists
# that the workload cannot skip inside the declared boundary); verified (enforced,
# with passing negative tests at a pinned release); unsupported (explicitly not provided).
# Checked by `go test ./tests/contract/... -run Claims`, which `make test` also runs.
# The check is static: an enforced or verified entry must name invariants and an
# enforcement point; a verified entry must also name a test and no finding; each
# named enforcement point, test and cordum public-source file must exist. It does
# not show that a statement matches its evidence or that the named code and tests
# cover the claim.
# Renaming a symbol or test named here means updating this file.
