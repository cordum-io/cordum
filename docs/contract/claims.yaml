# Claim register: one entry per protection claim, tied to an invariant, an
# enforcement point and a test, so that a claim cannot be stronger than its evidence.
# Status: planned (not built); supported (the feature exists, but a workload could
# bypass it or it is untested against bypass); enforced (an enforcement point exists
# that the workload cannot skip inside the declared boundary); verified (enforced,
# with passing negative tests at a pinned release); unsupported (explicitly not provided).
# Checked by `go test ./tests/contract/... -run Claims`, which `make test` also runs.
# Renaming a symbol or test named here means updating this file.
