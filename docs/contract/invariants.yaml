invariants:
  - id: I01
    statement: No authority, no protected effect.
    testable_form: 'A protected effect (process start, file write, API mutation or released bytes) happens only while a valid Cordum authorization for that exact action exists. Test: drive the action without one and assert the effect is absent.'
    entry_points: [edge-hook, mcp-tool-call, mcp-approval-gate, job-submit-http, job-submit-grpc, scheduler-dispatch, workflow-step, workflow-rerun, saga-compensation, bus-replay, policy-publish]
    findings: [R02, R13]
    status: violated
  - id: I02
    statement: Unsupported restriction means deny, not unrestricted allow.
    testable_form: 'If an entry point cannot enforce a restriction the decision attaches (a constraint field, an output scan or a redaction level), it denies before any effect. Test: attach an unenforceable restriction and assert deny with no effect.'
    entry_points: [edge-hook, mcp-tool-call, scheduler-dispatch, scheduler-output, policy-publish]
    findings: [R01, R07, R08]
    status: violated
  - id: I03
    statement: Approval never overrides a hard prohibition.
    testable_form: 'An input that matches a hard-deny rule is denied whether an approval is required, pending or granted. Test: approve an action that also matches a hard deny and assert no effect.'
    entry_points: [edge-hook, mcp-tool-call, mcp-approval-gate, scheduler-dispatch, workflow-step]
    findings: [R05, R09]
    tests: [{package: core/controlplane/safetykernel, name: TestKernelInvariants_DenyBlocksOtherwiseAllowedInput}, {package: core/controlplane/safetykernel, name: TestKernelInvariants_OutputDenyBlocksOtherwiseAllowed}, {package: core/controlplane/gateway, name: TestInvariantDenyBeatsMCPAllow}, {package: core/controlplane/gateway, name: TestInvariantAllowToolsImplicitDeny}, {package: core/controlplane/gateway, name: TestInvariantTenantScopedDeny}, {package: core/controlplane/gateway/policybundles, name: TestInvariantDenyBeatsPackAllow}, {package: core/controlplane/gateway/policybundles, name: TestPackUninstallRemovesPackRulesPreservesInvariants}]
    test_scope: 'SecOps invariant DENY precedence over ALLOW and over the MCP approval path, in the kernel evaluator, the MCP gate and the pack merge; not approval refresh, and not every entry point.'
    suites: [core/controlplane/safetykernel/kernel_invariants.go, core/controlplane/safetykernel/kernel_invariants_test.go, core/controlplane/gateway/mcp_gate_invariants.go, core/controlplane/gateway/mcp_gate_invariants_test.go, core/controlplane/gateway/policybundles/invariants.go, core/controlplane/gateway/policybundles/invariants_test.go]
    status: violated
  - id: I04
    statement: Different effective policy means different policy identity.
    testable_form: 'Two policy states that decide some input differently have different policy identities. Test: change a rule, default or precedence that alters a decision and assert the identity changes.'
    entry_points: [policy-publish, edge-hook, mcp-tool-call, scheduler-dispatch]
    findings: [R06]
    tests: [{package: core/controlplane/gateway/policybundles, name: TestInvariantSnapshotChangeBumpsCfgHash}]
    test_scope: 'A change to the SecOps invariants bundle changes the config hash; not every change to effective semantics.'
    suites: [core/controlplane/gateway/policybundles/invariants.go, core/controlplane/gateway/policybundles/invariants_test.go]
    status: violated
  - id: I05
    statement: The authorized inputs are the inputs actually used.
    testable_form: 'The arguments, referenced artifacts, target and execution context used at execution equal those the authorization covered. Test: change one after authorization and assert no effect.'
    entry_points: [edge-hook, mcp-tool-call, mcp-approval-gate, job-submit-http, job-submit-grpc, scheduler-dispatch, workflow-step]
    findings: [R02, R03, R04]
    status: violated
  - id: I06
    statement: Duplicate delivery does not imply completed processing.
    testable_form: 'Work is recorded as completed only after its processing finished; redelivered unfinished work is processed or reconciled. Test: assert completion is never recorded for unfinished work.'
    entry_points: [bus-replay, scheduler-dispatch, saga-compensation]
    findings: [R10]
    status: violated
  - id: I07
    statement: Revocation prevents future authorized effects within a published bound.
    testable_form: 'After a revocation, no effect it covers starts later than the published bound. Test: revoke an unused authorization and assert no effect after the bound.'
    entry_points: [edge-hook, mcp-approval-gate, scheduler-dispatch, workflow-step]
    findings: [R09]
    status: violated
  - id: I08
    statement: Unknown outcome is never reported as success.
    testable_form: 'An operation whose outcome is not confirmed is reported as unknown and reconciled, never as success. Test: leave an outcome unconfirmed and assert the reported state is not success.'
    entry_points: [bus-replay, scheduler-dispatch, saga-compensation, workflow-rerun]
    findings: [R10]
    status: violated
  - id: I09
    statement: Missing required evidence is never reported as verified.
    testable_form: 'A result reports verified only when every required piece of evidence is present and valid. Test: remove one required piece and assert the result is not verified.'
    entry_points: [audit-verify, policy-publish, edge-session]
    findings: [R11, R12, R14]
    status: violated
  - id: I10
    statement: A new execution path cannot weaken existing authorization.
    testable_form: 'No entry point applies weaker checks than the strongest existing path for the same action. Test: drive one hard-denied action through every entry point and assert no effect on any.'
    entry_points: [edge-hook, mcp-tool-call, mcp-approval-gate, job-submit-http, job-submit-grpc, scheduler-dispatch, workflow-step, workflow-rerun, saga-compensation, bus-replay]
    findings: [R15]
    tests: [{package: core/controlplane/safetykernel, name: TestEDGE052_OneInvariantBlocksAllFourSurfaces}, {package: core/controlplane/gateway, name: TestInvariantDenyBlocksEdgeEvaluate}, {package: core/controlplane/gateway, name: TestWireMCPApprovalGateAttachesInvariantLookupWithoutManualInjection}, {package: core/controlplane/gateway, name: TestLoadMCPInvariantsFromBundles}]
    test_scope: "One SecOps invariant DENY blocks the same action in the kernel's job, Edge, MCP-rule and output-scan evaluators (integration tag); the gateway forwards a kernel deny on Edge evaluate (stubbed kernel) and wires the MCP gate lookup. Job submit, workflow, saga and replay paths are not covered."
    suites: [core/controlplane/safetykernel/global_invariants_integration_test.go, core/controlplane/gateway/edge_evaluate_invariants_test.go, core/controlplane/gateway/mcp_gate_invariants.go, core/controlplane/gateway/mcp_gate_invariants_test.go]
    status: violated
