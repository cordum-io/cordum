# Contract catalog: I01-I10, with findings listed by id only.
# violated: an open finding maps here; holds: no open finding and linked tests;
# untested: no open finding and the property is not proven.
# Checked by go test ./tests/contract/... -run Invariants, part of make test.
# Renaming an anchored symbol or linked test requires updating this file.
schema_version: 1
entry_points:
  - {id: edge-hook, anchors: [{path: core/edge/agentd/evaluator.go, symbol: Evaluator.EvaluateHook}, {path: core/controlplane/gateway/handlers_edge_evaluate.go, symbol: server.handleEdgeEvaluate}]}
  - {id: mcp-tool-call, anchors: [{path: core/mcp/server.go, symbol: MCPServer.handleToolsCall}, {path: core/policy/actiongates/mcp_gate.go, symbol: MCPGate.Evaluate}]}
  - {id: mcp-approval-gate, anchors: [{path: core/controlplane/gateway/mcp_gate.go, symbol: gatewayApprovalGate.Check}]}
  - {id: job-submit-http, anchors: [{path: core/controlplane/gateway/handlers_jobs.go, symbol: server.handleSubmitJobHTTP}]}
  - {id: job-submit-grpc, anchors: [{path: core/controlplane/gateway/handlers_grpc.go, symbol: server.SubmitJob}]}
  - {id: scheduler-dispatch, anchors: [{path: core/controlplane/scheduler/engine.go, symbol: Engine.checkSafetyDecision}]}
  - {id: scheduler-output, anchors: [{path: core/controlplane/scheduler/output_safety_client.go, symbol: redactOutputContent}]}
