# Source-reviewed data classes; reviewed_at pins the reviewed tree.
# TestDataInventoryFile checks references, not deletion or legal-hold behavior.
# TestDataInventoryKeyCoverage (PR2-07-KEYS) maps every key-shaped literal, JetStream stream and Redis stream writer
# in non-test Go under core/ and cmd/ to an entry pattern or a file-scoped not_tenant_data classification.
# endpoint_only describes local copies/raw bytes; derived metadata may be sent separately.
schema_version: 1
reviewed_at: 469e6284ea6f90209a528b720dcb60715443e0cb
classes:
  - {id: raw-local-inputs, title: Endpoint inputs and local state}
  - {id: redacted-events, title: Redacted Edge records}
  - {id: evidence-audit, title: Evidence and audit records}
  - {id: hashes-commitments, title: Hashes and commitments}
  - {id: artifacts, title: Stored payloads and artifacts}
  - {id: telemetry, title: Telemetry and metrics}
  - {id: backups, title: Persistence and backup copies}
  - {id: exports, title: Export buffers and downloaded evidence}
  - {id: identity-access, title: 'Identity, session and credential records'}
  - {id: control-records, title: 'Job, workflow and coordination records'}
endpoint_only:
  - {id: DI-E01, class: raw-local-inputs,
     storage: {kind: file, location: 'CORDUM_AGENTD_STATE_DIR; default ~/.cordum/edge/sessions/<session>/state.json (temp-dir fallback)', writers: [{path: core/edge/agentd/state_store.go, symbol: FileStateStore.Save}, {path: core/edge/agentd/config.go, symbol: LoadConfig}]},
     content: {description: 'Local session-state copy and scrubbed metadata, not raw prompts; some session metadata also goes to Gateway', personal_data: possible},
     retention: {none: 'No age setting for local state files; the state-dir setting controls location only'},
     deletion: {none: 'No session-state cleanup API; Save replaces a file and removes its temporary file only'},
     legal_hold: {applies: false, reason: Local file writer does not consult legal holds}}
  - {id: DI-E02, class: raw-local-inputs,
     storage: {kind: process_memory, location: cordum-hook stdin and decoded request buffers, writers: [{path: cmd/cordum-hook/main.go, symbol: dispatchClaude}, {path: cmd/cordum-hook/main.go, symbol: dispatchCopilot}]},
     content: {description: 'Raw tool inputs/prompts before transformation; derived action facts are forwarded to agentd', personal_data: possible},
     retention: {none: 'No retention setting; buffers live for the hook process/request lifetime'},
     deletion: {none: 'Process termination and garbage collection; no explicit secure erasure routine'},
     legal_hold: {applies: false, reason: Hook memory has no legal-hold integration}}
  - {id: DI-E03, class: raw-local-inputs,
     storage: {kind: process_memory, location: agentd safe-allow cache, writers: [{path: core/edge/agentd/cache.go, symbol: SafeAllowCache.Put}]},
     content: {description: Local cache keys and filtered decision responses derived from action/policy/identity facts, personal_data: possible},
     retention: {settings: [{name: CORDUM_AGENTD_SAFE_ALLOW_CACHE_TTL, path: core/edge/agentd/config.go}], default: '5m; cache disabled by default; expiration checked on Get and overflow evicted on Put'},
     deletion: {paths: [{path: core/edge/agentd/cache.go, symbol: SafeAllowCache.Get}, {path: core/edge/agentd/cache.go, symbol: SafeAllowCache.evictOverflowLocked}]},
     legal_hold: {applies: false, reason: Local cache does not consult legal holds}}
  - {id: DI-E04, class: raw-local-inputs,
     storage: {kind: process_memory, location: opt-in shadow scanner raw configuration buffers and local process/environment reads, writers: [{path: core/edge/shadow/scanner.go, symbol: Scanner.scanOneConfig}, {path: core/edge/shadow/scanner.go, symbol: Scanner.scanEnvVars}]},
     content: {description: 'Raw config bytes stay in the scan; redacted summaries/path metadata become findings, not raw config or environment values', personal_data: possible},
     retention: {none: 'No raw-buffer retention setting; source config files remain owned by their applications'},
     deletion: {none: 'Garbage collection of scan buffers; scanner does not delete source configuration files'},
     legal_hold: {applies: false, reason: Scanner does not consult legal holds}}
