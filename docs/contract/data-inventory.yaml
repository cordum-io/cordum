     deletion: {none: 'No automatic audit-stream trimmer found at reviewed_at; storage deletion is operator-managed'},
     legal_hold: {applies: false, reason: 'Hold records/API exist but no stream cleanup consults IsUnderHold at reviewed_at', refs: [{path: core/audit/legal_hold.go, symbol: LegalHoldStore.IsUnderHold}]}}
