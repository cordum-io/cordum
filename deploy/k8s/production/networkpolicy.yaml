# Default-deny: block all ingress and egress unless explicitly allowed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-default-deny
  namespace: cordum
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Ingress policy for api-gateway — only accept from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-ingress-api-gateway
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-api-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 9092
---
# Ingress policy for safety kernel — the gateway and the scheduler call its
# gRPC port (their egress policies allow 50051)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-ingress-safety-kernel
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-safety-kernel
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: cordum-api-gateway
    - podSelector:
        matchLabels:
          app: cordum-scheduler
    ports:
    - protocol: TCP
      port: 50051
---
# Ingress policy for dashboard — only accept from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-ingress-dashboard
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-dashboard
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-allow-nats
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nats
    - podSelector:
        matchLabels:
          app: cordum-api-gateway
    - podSelector:
        matchLabels:
          app: cordum-scheduler
    - podSelector:
        matchLabels:
          app: cordum-workflow-engine
    - podSelector:
        matchLabels:
          app: cordum-safety-kernel
    - podSelector:
        matchLabels:
          app: cordum-context-engine
    ports:
    - protocol: TCP
      port: 4222
    - protocol: TCP
      port: 6222
    - protocol: TCP
      port: 8222
  # The NATS backup CronJob reaches the client port only.
  - from:
    - podSelector:
        matchLabels:
          app: cordum-nats-backup
    ports:
    - protocol: TCP
      port: 4222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-allow-redis
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: redis
    - podSelector:
        matchLabels:
          app: cordum-api-gateway
    - podSelector:
        matchLabels:
          app: cordum-scheduler
    - podSelector:
        matchLabels:
          app: cordum-workflow-engine
    - podSelector:
        matchLabels:
          app: cordum-context-engine
    - podSelector:
        matchLabels:
          app: cordum-safety-kernel
    ports:
    - protocol: TCP
      port: 6379
    # Redis cluster bus (gossip and failover; replication uses 6379)
    - protocol: TCP
      port: 16379
  # The cluster init Job and the Redis backup CronJob reach the client port
  # only.
  - from:
    - podSelector:
        matchLabels:
          app: cordum-redis-cluster-init
    - podSelector:
        matchLabels:
          app: cordum-redis-backup
    ports:
    - protocol: TCP
      port: 6379
---
# Egress policies — restrict outbound traffic per service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-api-gateway
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-api-gateway
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: cordum-safety-kernel
    ports:
    - protocol: TCP
      port: 50051
  # DNS for service discovery
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # External HTTPS for marketplace, webhooks, OIDC
  - ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-scheduler
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-scheduler
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: cordum-safety-kernel
    ports:
    - protocol: TCP
      port: 50051
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-workflow-engine
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-workflow-engine
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-dashboard
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-dashboard
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: cordum-api-gateway
    ports:
    - protocol: TCP
      port: 8081
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-safety-kernel
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-safety-kernel
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # External HTTPS for remote policy fetch
  - ports:
    - protocol: TCP
      port: 443
---
# Egress policy for context-engine — Redis + DNS only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-context-engine
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-context-engine
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Egress for NATS servers: cluster routes to their peers, and DNS to resolve
# the cordum-nats-N.cordum-nats route URLs in nats.conf.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-nats
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 6222
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Egress for Redis nodes: the cluster bus to their peers, and a primary's TLS
# port for replication. Nodes address each other by IP, so they need no DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-redis
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 16379
---
# Egress for the Redis cluster init Job and the Redis backup CronJob: the
# Redis client port, and DNS for the cordum-redis-N.cordum-redis names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-redis-jobs
  namespace: cordum
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - cordum-redis-cluster-init
      - cordum-redis-backup
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Egress for the NATS backup CronJob: the NATS client port, and DNS for
# cordum-nats.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordum-egress-nats-backup
  namespace: cordum
spec:
  podSelector:
    matchLabels:
      app: cordum-nats-backup
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
