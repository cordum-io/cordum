apiVersion: v1
kind: Service
metadata:
  name: cordum-nats
  namespace: cordum
spec:
  clusterIP: None
  # The route URLs in nats.conf name the pods through this Service. A server
  # turns ready only after JetStream has a meta leader, which needs the routes,
  # so publish the pods before they are ready.
  publishNotReadyAddresses: true
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: cluster
    port: 6222
    targetPort: 6222
  - name: monitor
    port: 8222
    targetPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: cordum-nats-monitor
  namespace: cordum
  labels:
    app: cordum-nats-monitor
spec:
  selector:
    app: nats
  ports:
  - name: monitor
    port: 8222
    targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cordum-nats
  namespace: cordum
spec:
  serviceName: cordum-nats
  replicas: 3
  # Start all three servers together: one server alone never passes /healthz
  # ("JetStream has not established contact with a meta leader"), so ordered
  # startup would wait on cordum-nats-0 forever.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: nats
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
      - name: nats
        image: nats:2.10
        # The image has no shell; Kubernetes expands $(POD_NAME) itself.
        args: ["-c", "/etc/nats/nats.conf", "-n", "$(POD_NAME)"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: client
          containerPort: 4222
        - name: cluster
          containerPort: 6222
        - name: monitor
          containerPort: 8222
        startupProbe:
          httpGet:
            path: /healthz
            port: 8222
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/nats/nats.conf
          subPath: nats.conf
          readOnly: true
        - name: tls
          mountPath: /etc/nats/tls
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: cordum-nats-config
      - name: tls
        secret:
          secretName: cordum-nats-server-tls
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
