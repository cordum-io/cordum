apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cordum-backups
  namespace: cordum
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cordum-redis-backup
  namespace: cordum
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cordum-redis-backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: redis-backup
            image: redis:7
            command:
            - sh
            - -c
            - |
              set -eu
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              export REDISCLI_AUTH="$REDIS_PASSWORD"
              . /etc/cordum/backup/guards.sh
              cd /backup
              test ! -e "redis-$ts.topology"
              redis_topology > "redis-$ts.topology"
              while read -r node rest; do
                redis_topology > /tmp/current.topology
                cmp "redis-$ts.topology" /tmp/current.topology
                redis_client -h "cordum-redis-${node#node}.cordum-redis.cordum.svc" -p 6379 \
                  --rdb "redis-$ts-$node.rdb"
                redis-check-rdb "redis-$ts-$node.rdb"
                redis_topology > /tmp/current.topology
                cmp "redis-$ts.topology" /tmp/current.topology
              done < "redis-$ts.topology"
              # The completion marker binds the topology and every shard's bytes.
              { sha256sum "redis-$ts.topology"
                while read -r node rest; do sha256sum "redis-$ts-$node.rdb"; done < "redis-$ts.topology"
              } > "redis-$ts.sha256.tmp"
              mv "redis-$ts.sha256.tmp" "redis-$ts.sha256"
              # Retain this digest in an access-controlled catalog outside this PVC.
              sha256sum "redis-$ts.sha256"
            env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cordum-redis-secret
                  key: REDIS_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            volumeMounts:
            - name: backup-scripts
              mountPath: /etc/cordum/backup
              readOnly: true
            - name: backup
              mountPath: /backup
            - name: client-tls
              mountPath: /etc/cordum/tls/client
              readOnly: true
          volumes:
          - name: backup-scripts
            configMap:
              name: cordum-redis-backup-scripts
          - name: backup
            persistentVolumeClaim:
              claimName: cordum-backups
          - name: client-tls
            secret:
              secretName: cordum-client-tls
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cordum-nats-backup
  namespace: cordum
spec:
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cordum-nats-backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: nats-backup
            image: natsio/nats-box:0.15.0
            command:
            - sh
            - -c
            - |
              set -e
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              mkdir -p /backup/nats-${ts}
              nats --server tls://cordum-nats:4222 \
                --tlsca /etc/cordum/tls/client/ca.crt \
                --tlscert /etc/cordum/tls/client/tls.crt \
                --tlskey /etc/cordum/tls/client/tls.key \
                stream snapshot CORDUM_SYS /backup/nats-${ts}/CORDUM_SYS.snapshot
              nats --server tls://cordum-nats:4222 \
                --tlsca /etc/cordum/tls/client/ca.crt \
                --tlscert /etc/cordum/tls/client/tls.crt \
                --tlskey /etc/cordum/tls/client/tls.key \
                stream snapshot CORDUM_JOBS /backup/nats-${ts}/CORDUM_JOBS.snapshot
              cd /backup/nats-${ts}
              sha256sum CORDUM_SYS.snapshot/backup.json CORDUM_SYS.snapshot/stream.tar.s2 \
                CORDUM_JOBS.snapshot/backup.json CORDUM_JOBS.snapshot/stream.tar.s2 > SHA256SUMS.tmp
              mv SHA256SUMS.tmp SHA256SUMS
              # Retain this digest in an access-controlled catalog outside this PVC.
              printf 'NATS backup %s manifest: ' "$ts"
              sha256sum SHA256SUMS
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
            - name: client-tls
              mountPath: /etc/cordum/tls/client
              readOnly: true
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: cordum-backups
          - name: client-tls
            secret:
              secretName: cordum-client-tls
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cordum-backup-retention
  namespace: cordum
spec:
  schedule: "30 3 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: busybox:1.36
            command:
            - sh
            - -c
            - |
              set -e
              echo "Cleaning Redis backups older than 7 days..."
              find /backup -name '*.rdb' -mtime +7 -delete -print
              find /backup -name 'redis-*.topology' -mtime +7 -delete -print
              find /backup -name 'redis-*.sha256*' -mtime +7 -delete -print
              echo "Cleaning NATS snapshot dirs older than 7 days..."
              find /backup -maxdepth 1 -name 'nats-*' -type d -mtime +7 -exec rm -rf {} + -print
              echo "Retention cleanup complete."
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: cordum-backups
