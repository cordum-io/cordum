global:
  scrape_interval: 2s
  evaluation_interval: 2s
scrape_configs:
  - job_name: cordum-gateway
    static_configs:
      - targets: [host.docker.internal:29092]
        labels:
          namespace: local-demo
  - job_name: cordum-scheduler
    static_configs:
      - targets: [host.docker.internal:29090]
        labels:
          namespace: local-demo
