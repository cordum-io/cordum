name: Platform Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  platform-smoke:
    name: platform-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"

      - name: Configure masked CI credentials
        run: |
          source tools/scripts/github_actions_mask_env.sh
          api_key="$(openssl rand -hex 32)" || exit 1
          gha_mask_env CORDUM_API_KEY "${api_key}"
          redis_password="$(openssl rand -hex 32)" || exit 1
          gha_mask_env REDIS_PASSWORD "${redis_password}"

      - name: Generate TLS certificates
        run: |
          go run ./cmd/cordumctl generate-certs --dir ./certs
          chmod -R a+rX ./certs

      - name: Start services
        run: docker compose up -d --build
        env:
          CORDUM_API_KEY: ${{ env.CORDUM_API_KEY }}
          REDIS_PASSWORD: ${{ env.REDIS_PASSWORD }}

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 30); do
            if curl -ksf -H "X-API-Key: ${CORDUM_API_KEY}" https://127.0.0.1:8081/api/v1/status > platform-smoke-health.json; then
              echo "Gateway healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for https://127.0.0.1:8081/api/v1/status" >&2
          exit 1

      - name: Run platform smoke script
        run: bash tools/scripts/platform_smoke.sh 2>&1 | tee platform-smoke.log
        env:
          CORDUM_API_KEY: ${{ env.CORDUM_API_KEY }}
          CORDUM_API_BASE: https://localhost:8081
          CORDUM_TLS_CA: ${{ github.workspace }}/certs/ca/ca.crt
          REDIS_PASSWORD: ${{ env.REDIS_PASSWORD }}

      - name: Capture docker compose logs
        if: always()
        run: |
          touch platform-smoke.log platform-smoke-health.json
          docker compose logs > docker-compose-platform-smoke.log 2>&1 || true

      - name: Redact platform smoke artifacts
        id: redact_platform_smoke_artifacts
        if: always()
        env:
          CORDUM_API_KEY: ${{ env.CORDUM_API_KEY || 'credential-unavailable-for-redaction' }}
          REDIS_PASSWORD: ${{ env.REDIS_PASSWORD || 'credential-unavailable-for-redaction' }}
        run: |
          source tools/scripts/github_actions_mask_env.sh
          gha_redact_paths CORDUM_API_KEY REDIS_PASSWORD -- platform-smoke.log platform-smoke-health.json docker-compose-platform-smoke.log

      - name: Upload platform smoke artifacts
        if: always() && steps.redact_platform_smoke_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-artifacts
          path: |
            platform-smoke.log
            platform-smoke-health.json
            docker-compose-platform-smoke.log

      - name: Tear down services
        if: always()
        run: docker compose down -v
