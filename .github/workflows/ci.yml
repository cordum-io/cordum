name: CI

# Two tiers.
#
# Merge CI runs on pull_request, merge_group and pushes. It is kept small:
# fast static checks and unit tests (Test, Lint, Build, Security Scan,
# OpenAPI Validate). Dashboard Tests and Lighthouse also run when a change
# touches the dashboard or the OpenAPI spec.
#
# Nightly runs on the schedule below, or on demand through workflow_dispatch
# (`gh workflow run CI --ref <branch>`). It covers the jobs that boot
# services or run long suites: benchmarks, Handshake Trust Interop and
# Quickstart Env Sharing.
# - Integration-tagged tests run nightly in integration-nightly.yml, so the
#   Integration Tests job here runs only on workflow_dispatch.
# - The E2E suites run nightly in their own workflows: platform-smoke.yml,
#   demo-mock-bank-e2e.yml, e2e.yml and edge-fake-hook-e2e.yml.
#
# A job that its `if:` skips reports success, so moving a job to the
# nightly tier never leaves a required check pending on a PR.
on:
  push:
    branches: [ main, develop ]
  # 'moe/**' included so stacked agent PRs (base = another moe/* branch)
  # get full CI instead of only the unfiltered smoke/e2e workflows.
  pull_request:
    branches: [ main, develop, 'moe/**' ]
  merge_group:
    types: [checks_requested]
  schedule:
    # 02:41 UTC daily. The odd minute avoids top-of-hour runner contention.
    - cron: '41 2 * * *'
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dashboard: ${{ steps.diff.outputs.dashboard }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Diff against the event's base
      id: diff
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        case "${EVENT_NAME}" in
          pull_request) base="$(git rev-parse HEAD^1)" ;;
          merge_group)  base="${MERGE_GROUP_BASE}" ;;
          push)         base="${PUSH_BEFORE}" ;;
          *)            echo "dashboard=true" >> "${GITHUB_OUTPUT}"; exit 0 ;;
        esac
        if [[ -z "${base}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          echo "::notice::no usable diff base for ${EVENT_NAME}; running every conditional job"
          echo "dashboard=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        changed="$(git diff --no-renames --name-only "${base}" HEAD)"  # a move out of dashboard/ still lists its source path
        if grep -Eq '^(dashboard/|docs/api/openapi/|tools/scripts/check_dashboard_deps\.sh$|\.github/workflows/ci\.yml$)' <<<"${changed}"; then
          echo "dashboard=true" >> "${GITHUB_OUTPUT}"
        else
          echo "dashboard=false" >> "${GITHUB_OUTPUT}"
        fi

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.3']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    - name: Drop local replace directives (CI uses published modules)
      run: |
        go mod edit -dropreplace github.com/cordum-io/cap/v2
        go mod tidy

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    # Benchmarks + their storage step are advisory (continue-on-error).
    # They're informational performance tracking, not a correctness
    # gate — flakes (e.g. occasional benchmark panics on shared CI
    # runners, or the action's gh-pages auto-push tripping on a dirty
    # working tree after `> benchmark_raw.txt` creates an untracked
    # file) should not block merges. The benchmark-action writes to a
    # separate gh-pages branch, so skipping a run has no impact on
    # code correctness. They run in the nightly tier only, so the
    # required Test check stays fast; the nightly run is on main and
    # stores the results there.
    - name: Run benchmarks
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      continue-on-error: true
      run: |
        go test -run=^$ -bench=. -benchmem ./... > benchmark_raw.txt
        # Keep only valid Go benchmark output lines (results + header).
        # This avoids log interleaving that can corrupt benchmark-action parsing.
        grep -E '^(Benchmark[^[:space:]]+[[:space:]]+[0-9]+[[:space:]]+[0-9.]+[[:space:]]+ns/op|goos:|goarch:|pkg:|cpu:)' benchmark_raw.txt > benchmark.txt || true
        cat benchmark.txt

    - name: Check benchmark output
      id: benchmark_check
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      continue-on-error: true
      run: |
        if [ -f benchmark.txt ] && grep -q '^Benchmark' benchmark.txt; then
          echo "has_benchmark=true" >> $GITHUB_OUTPUT
        else
          echo "has_benchmark=false" >> $GITHUB_OUTPUT
        fi

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
      continue-on-error: true
      if: github.ref == 'refs/heads/main' && steps.benchmark_check.outputs.has_benchmark == 'true'
      with:
        tool: 'go'
        output-file-path: benchmark.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true

  # integration-nightly.yml runs the same integration-tagged suite every night,
  # with services up. This job is kept for on-demand runs only.
  integration-tests:
    name: Integration Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache: false

    - name: Drop local replace directives (CI uses published modules)
      run: |
        go mod edit -dropreplace github.com/cordum-io/cap/v2
        go mod tidy

    - name: Run integration-tagged tests
      run: go test -v -tags=integration -timeout 10m ./...

  handshake-trust-interop:
    name: Handshake Trust Interop
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CAP_REV: e580c670d54a7563c749835c7dd09d81f116c823
      CAP_HANDSHAKE_CAP_SHA: e580c670d54a7563c749835c7dd09d81f116c823
      CAP_HANDSHAKE_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
    - uses: actions/checkout@v7

    - name: Check out exact CAP dependency
      uses: actions/checkout@v7
      with:
        repository: cordum-io/cap
        ref: ${{ env.CAP_REV }}
        path: cap
        fetch-tags: true

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: cap/sdk/node/package-lock.json

    - name: Verify workflow trust pins
      run: ./tools/scripts/handshake_interop_workflow.test.sh

    - name: Run installed-artifact handshake interop
      run: ./tests/handshakeinterop/run.sh "$GITHUB_WORKSPACE/cap"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache: false

    - name: Check gofmt on every tracked Go file
      # Explicit bash = -eo pipefail: a failing git ls-files or a gofmt parse error fails the step.
      shell: bash
      run: |
        unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt drift in the files listed below; run gofmt -w on them"
          printf '%s\n' "$unformatted"
          exit 1
        fi

    - name: Drop local replace directives (CI uses published modules)
      run: |
        go mod edit -dropreplace github.com/cordum-io/cap/v2
        go mod tidy

    - name: Repo-root build
      run: go build ./...

    - name: Repo-root vet
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.11.4
        args: --timeout=5m

    - name: Lint shell scripts for secret leaks
      run: bash tools/scripts/lint_no_secret_log.sh

    - name: Self-test the secret/shell-exec lint guard
      run: bash tools/scripts/lint_no_secret_log.test.sh

    - name: Set up Python for deployment manifest validation
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install pinned deployment validator dependency
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

    - name: Set up Helm for deployment manifest self-tests
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.2.0

    - name: Validate deployment trust defaults
      run: |
        bash tools/scripts/validate_deploy_manifests.test.sh
        bash tools/scripts/validate_deploy_manifests.sh --strict

    - name: Self-test workflow and production-gate contracts
      run: |
        bash tools/scripts/fetch_stargazers.test.sh
        bash tools/scripts/production_gate_http.test.sh
        bash tools/scripts/production_gate.test.sh
        bash tools/scripts/runtime_credential_masking.test.sh
        bash tools/scripts/nightly_workflows.test.sh
        bash tools/scripts/soak_test_lib.test.sh
        bash tools/scripts/handshake_interop_workflow.test.sh

  dashboard-test:
    name: Dashboard Tests
    needs: [changes]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # Required for the Phase 5d (task-50bbfd7d) bundle-size PR comment.
      # Comment is posted only on pull_request events; main pushes still
      # build + run the size parser but skip the comment step.
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 9.15.9
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: dashboard/.nvmrc
        cache: pnpm
        cache-dependency-path: dashboard/pnpm-lock.yaml

    - name: Check dashboard dependency hygiene (EDGE-074)
      run: bash tools/scripts/check_dashboard_deps.sh

    - name: Install dashboard dependencies
      working-directory: dashboard
      run: pnpm install --frozen-lockfile

    - name: Check API codegen drift
      working-directory: dashboard
      run: pnpm run check-api-codegen

    - name: Lint dashboard
      working-directory: dashboard
      run: pnpm run lint

    - name: Lint dashboard accessibility
      working-directory: dashboard
      run: pnpm run lint:a11y

    - name: Typecheck dashboard (noUnusedLocals + noUnusedParameters gate, task-dd1a5934)
      working-directory: dashboard
      run: pnpm exec tsc --noEmit

    - name: Run dashboard tests
      working-directory: dashboard
      run: |
        mkdir -p test-results
        # JUnit omits run-level errors; retain their console diagnostics too.
        pnpm exec vitest run --reporter=default --reporter=junit --outputFile=./test-results/vitest.xml

    - name: Upload dashboard test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dashboard-vitest-results
        path: dashboard/test-results/vitest.xml

    # Phase 5d (task-50bbfd7d) — production build + bundle-size soft gate.
    # Build runs AFTER vitest so build failures don't mask test failures.
    - name: Build dashboard
      working-directory: dashboard
      run: pnpm run build

    - name: Compute bundle-size report
      working-directory: dashboard
      run: node scripts/parse-bundle-stats.mjs > "$RUNNER_TEMP/bundle-stats.md"

    - name: Upload bundle visualizer artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dashboard-bundle-stats
        path: |
          dashboard/dist/stats.html
          ${{ runner.temp }}/bundle-stats.md
        retention-days: 14

    - name: Find existing bundle-size comment
      if: github.event_name == 'pull_request'
      id: find-bundle-size-comment
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: "github-actions[bot]"
        body-includes: "<!-- bundle-size-report -->"

    - name: Post bundle-size comment to PR
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.find-bundle-size-comment.outputs.comment-id }}
        body-path: ${{ runner.temp }}/bundle-stats.md
        edit-mode: replace

  lhci-login:
    name: Lighthouse CI (/login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.dashboard == 'true'
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 9.15.9
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: dashboard/.nvmrc
        cache: pnpm
        cache-dependency-path: dashboard/pnpm-lock.yaml

    - name: Install dashboard dependencies
      working-directory: dashboard
      run: pnpm install --frozen-lockfile

    - name: Build dashboard for preview
      working-directory: dashboard
      run: pnpm run build

    - name: Run Lighthouse CI against /login (warn-only)
      id: lhci
      working-directory: dashboard
      continue-on-error: true
      run: pnpm run lhci

    # lighthouserc.json uploads to temporary-public-storage, which writes only
    # links.json. The filesystem target is what writes manifest.json, and
    # LHCI_NO_LIGHTHOUSERC keeps this extra upload from inheriting the rc's target.
    - name: Write Lighthouse CI manifest for the PR comment
      id: lhci-manifest
      if: always() && steps.lhci.outcome != 'skipped'
      working-directory: dashboard
      continue-on-error: true
      env:
        LHCI_NO_LIGHTHOUSERC: "1"
      run: pnpm exec lhci upload --target=filesystem --outputDir=.lighthouseci/filesystem

    - name: Comment Lighthouse scores on PR
      if: always() && steps.lhci.outcome != 'skipped'
      uses: actions/github-script@v9
      env:
        LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        MANIFEST_OUTCOME: ${{ steps.lhci-manifest.outcome }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const lhciDir = '.lighthouseci';
          const dashboardDir = 'dashboard';
          const marker = '<!-- lighthouse-login-report -->';
          let body = `${marker}\n### Lighthouse CI — \`/login\`\n\n`;
          try {
            const manifestPath = path.join(dashboardDir, lhciDir, 'filesystem', 'manifest.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const median = manifest.find(m => m.isRepresentativeRun) || manifest[0];
            if (!median) {
              body += `_No representative run found in manifest (lhci: ${process.env.LHCI_OUTCOME}, manifest: ${process.env.MANIFEST_OUTCOME})._\n`;
            } else {
              const summary = median.summary || {};
              const fmt = v => (v == null ? 'n/a' : Math.round(v * 100));
              body += '| Category | Score |\n|---|---|\n';
              body += `| Performance | ${fmt(summary.performance)} |\n`;
              body += `| Accessibility | ${fmt(summary.accessibility)} |\n`;
              body += `| Best Practices | ${fmt(summary['best-practices'])} |\n`;
              body += `| SEO | ${fmt(summary.seo)} |\n\n`;
              // The filesystem manifest's url is the audited (runner-local) URL.
              // temporary-public-storage records the public report URL per
              // audited URL in links.json; prefer it when present.
              let reportUrl = median.url;
              try {
                const links = JSON.parse(fs.readFileSync(path.join(dashboardDir, lhciDir, 'links.json'), 'utf8'));
                if (links && links[median.url]) reportUrl = links[median.url];
              } catch (_) { /* no public upload; keep the audited URL */ }
              if (reportUrl) body += `Run URL: ${reportUrl}\n`;
            }
            body += `\n_Soft thresholds (warn-only): perf ≥ 70, a11y ≥ 90, best-practices ≥ 85. Authenticated-flow lhci is filed as a follow-up task._`;
          } catch (e) {
            body += `_Lighthouse CI results unavailable (lhci: ${process.env.LHCI_OUTCOME}, manifest: ${process.env.MANIFEST_OUTCOME}): ${e.message}_`;
          }
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find(comment => comment.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Upload lhci artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lhci-login-results
        path: dashboard/.lighthouseci/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read          # checkout
      security-events: write  # upload-sarif to the code-scanning API

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache: false

    - name: Drop local replace directives (CI uses published modules)
      run: |
        go mod edit -dropreplace github.com/cordum-io/cap/v2
        go mod tidy

    - name: Install gosec
      env:
        GOFLAGS: ""
        GOTOOLCHAIN: local
      run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4

    # gosec runs once per Go module (cmd+core live in the root module; the
    # shipped SDK is a separate module). `./sdk/...` from the root module
    # matches nothing, so each module is scanned with its own scoped patterns.
    # -no-fail keeps these steps green; the "Fail on gosec findings" gate below
    # is the single place that fails the job, so SARIF still uploads on failure.
    - name: Run gosec (core platform + CLIs)
      env:
        GOFLAGS: ""
        GOTOOLCHAIN: local
      run: gosec -no-fail -fmt sarif -out gosec-core.sarif -exclude-dir=vendor ./cmd/... ./core/...

    - name: Run gosec (Go SDK)
      working-directory: sdk
      env:
        GOFLAGS: ""
        GOTOOLCHAIN: local
      run: gosec -no-fail -fmt sarif -out ../gosec-sdk.sarif -exclude-dir=vendor ./client/... ./runtime/...

    - name: Sanitize SARIF
      # Strip rule relationship metadata and generated-protobuf (.pb.go)
      # results (noise, not actionable). The SDK SARIF paths are relative to
      # the sdk/ module dir, so prefix them back to repo-root for the Security
      # tab. The gate counts the sanitized set.
      run: |
        sanitize() { # $1=in $2=out $3=uri-prefix(optional)
          jq --arg p "${3:-}" '
            (.runs[]?.tool.driver.rules[]? |= del(.relationships))
            | (.runs[]?.results |= ((. // []) | map(select(
                ([.locations[]?.physicalLocation.artifactLocation.uri // ""] | any(endswith(".pb.go"))) | not
              ))))
            | (if $p != "" then (.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation.uri |= ($p + .)) else . end)
          ' "$1" > "$2"
        }
        sanitize gosec-core.sarif gosec-core.cleaned.sarif ""
        sanitize gosec-sdk.sarif  gosec-sdk.cleaned.sarif  "sdk/"

    # Core keeps the default analysis category so the pre-existing gosec alerts
    # uploaded under it are auto-resolved when they disappear from the SARIF.
    - name: Upload SARIF (core)
      if: always() && hashFiles('gosec-core.cleaned.sarif') != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        sarif_file: gosec-core.cleaned.sarif

    - name: Upload SARIF (sdk)
      if: always() && hashFiles('gosec-sdk.cleaned.sarif') != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        sarif_file: gosec-sdk.cleaned.sarif
        category: gosec-sdk

    - name: Fail on gosec findings
      run: |
        total=$(jq -s '[.[].runs[].results[]] | length' gosec-core.cleaned.sarif gosec-sdk.cleaned.sarif)
        echo "gosec findings after sanitize: $total"
        if [ "$total" -gt 0 ]; then
          echo "::error::gosec reported $total finding(s); see the Security tab (categories: default + gosec-sdk)"
          jq -r '.runs[]?.results[]? | "  \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0)"' gosec-core.cleaned.sarif gosec-sdk.cleaned.sarif || true
          exit 1
        fi

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache: false

    - name: Drop local replace directives (CI uses published modules)
      run: |
        go mod edit -dropreplace github.com/cordum-io/cap/v2
        go mod tidy

    - name: Build all binaries
      run: |
        mkdir -p bin
        go build -v -o bin/ ./cmd/...

    - name: Verify binaries
      run: |
        for binary in bin/*; do
          echo "Built $binary"
          if [ ! -x "$binary" ] || [ ! -s "$binary" ]; then
            echo "Binary not executable or empty: $binary"
            exit 1
          fi
        done

  quickstart-env-sharing:
    name: Quickstart Env Sharing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'

    - name: Generate TLS certificates
      run: |
        go run ./cmd/cordumctl generate-certs --dir ./certs
        chmod -R a+rX ./certs

    - name: Build compose images
      run: docker compose build
      env:
        CORDUM_API_KEY: quickstart-env-sharing-build-key
        REDIS_PASSWORD: quickstart-env-sharing-build-redis

    - name: Run quickstart env-sharing test
      run: bash tools/scripts/quickstart_env_sharing_test.sh
      env:
        CORDUM_INTEGRATION: "1"
        CORDUM_QUICKSTART_ENV_SHARING_MODE: live

    - name: Dump debug logs on failure
      if: failure()
      run: |
        export CORDUM_API_KEY="${CORDUM_API_KEY:-quickstart-env-sharing-debug-key}"
        export REDIS_PASSWORD="${REDIS_PASSWORD:-quickstart-env-sharing-debug-redis}"
        echo "=== Docker service logs (last 80 lines each) ==="
        for svc in scheduler workflow-engine api-gateway safety-kernel nats redis; do
          echo "--- $svc ---"
          docker compose logs --tail=80 --no-color "$svc" 2>/dev/null || true
        done

    - name: Tear down services
      if: always()
      run: |
        export CORDUM_API_KEY="${CORDUM_API_KEY:-quickstart-env-sharing-teardown-key}"
        export REDIS_PASSWORD="${REDIS_PASSWORD:-quickstart-env-sharing-teardown-redis}"
        docker compose down -v

  openapi:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache: false

    - name: Install oasdiff
      run: go install github.com/oasdiff/oasdiff@v1.11.7

    - name: Mark allow-breaking if commit message requests it
      id: allow_breaking
      # On pull_request events, checkout@v4 creates a synthetic merge commit
      # so `git log -1` reads the merge message rather than the contributor's
      # commit. Inspect the contributor commit (HEAD^2 on PR merges, HEAD
      # otherwise) so the allow-breaking-openapi marker actually takes effect.
      # On merge_group events HEAD is the queue's squash commit. The repo's
      # squash message setting is COMMIT_MESSAGES, so that commit carries the
      # queued PR's commit messages and the marker is read from HEAD. If the
      # setting changes, put the marker in the PR description instead.
      run: |
        TARGET_REF="HEAD"
        if [[ "${{ github.event_name }}" == "pull_request" ]] && git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
          TARGET_REF="HEAD^2"
        fi
        if git log -1 --pretty=%B "$TARGET_REF" | grep -q 'allow-breaking-openapi'; then
          echo "OPENAPI_ALLOW_BREAKING=1" >> "$GITHUB_ENV"
          echo "::notice::allow-breaking-openapi marker found on $TARGET_REF; oasdiff will not fail on breaking changes"
        fi

    - name: Validate OpenAPI
      run: make openapi-validate
      env:
        OPENAPI_BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || 'main') }}
