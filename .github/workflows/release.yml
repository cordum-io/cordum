name: Release binaries

# EDGE-151 — release-time binary integrity. docker.yml calls this workflow:
# binaries on v* tags inherits secrets; binaries-dry-run on release-dry-run/**
# passes no secrets. The called workflow:
#   1. Cross-compiles cordum-hook, cordum-agentd, and cordum-claude for 5
#      desktop targets (Linux amd64/arm64, macOS amd64/arm64, Windows amd64)
#      with the production release fingerprint pinned at link time.
#   2. Tier 1 (always-on): writes a deterministic SHA256SUMS manifest, signs
#      it keylessly with cosign (GitHub OIDC, Sigstore) into
#      SHA256SUMS.sigstore.json, then runs tools/scripts/install.sh on the
#      release directory and on a copy with one changed byte, which it must
#      refuse. Both callers grant id-token: write for the signature. When
#      GPG_RELEASE_KEY_PRIVATE is provisioned it also writes SHA256SUMS.asc.
#   3. Tier 2 (conditional on OS-native secrets + canonical-repo only):
#      Apple Developer ID codesign + notarization for the darwin binaries,
#      Authenticode signtool for the windows binary. Forks degrade
#      gracefully to Tier 1 via `continue-on-error: true`.
#   4. Writes the binary qualification entry; docker.yml's publish-binaries
#      job publishes the manifest and binaries against the run's record.
#
# Fork behaviour: missing secrets cause the matching job to log a banner
# and exit success-skipped; the workflow still succeeds with Tier 1 only.
# See docs/security/binary-signing.md for the trust boundary.

on:
  workflow_call:

permissions:
  contents: read

env:
  EXPECTED_BINARIES: >-
    cordum-agentd-darwin-amd64 cordum-agentd-darwin-arm64 cordum-agentd-linux-amd64
    cordum-agentd-linux-arm64 cordum-agentd-windows-amd64.exe cordum-claude-darwin-amd64
    cordum-claude-darwin-arm64 cordum-claude-linux-amd64 cordum-claude-linux-arm64
    cordum-claude-windows-amd64.exe cordum-hook-darwin-amd64 cordum-hook-darwin-arm64
    cordum-hook-linux-amd64 cordum-hook-linux-arm64 cordum-hook-windows-amd64.exe
  BINARY_NO_RELEASE_GATE_REASON: "No release-time test or scan runs against the Edge binaries; the record pins their sha256 digests."

jobs:
  version-monotonicity:
    # EDGE-151-DOWNGRADE: refuse a tag push whose semver is not strictly
    # greater than the most recently published tag. Prevents accidental
    # sibling-release downgrade at the moment a tag is created — the
    # release-time companion to install.{sh,ps1}'s version-floor check.
    name: tag monotonicity gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Resolve pushed and prior tags
        id: tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pushed="${GITHUB_REF#refs/tags/}"
          # Most-recent prior tag, excluding the one being pushed. We fall
          # back to v0.0.0 when no prior tag exists (first release ever).
          prior="$(git tag --list 'v*' --sort=-v:refname \
                    | grep -vxF "$pushed" | head -1)"
          if [ -z "$prior" ]; then
            prior="v0.0.0"
          fi
          echo "pushed=$pushed" >>"$GITHUB_OUTPUT"
          echo "prior=$prior"   >>"$GITHUB_OUTPUT"
          echo "Pushed: $pushed, Prior: $prior"
      - name: Enforce monotonicity
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          go run ./tools/sign/cmd/version-cli monotonic-or-fail \
            "${{ steps.tags.outputs.pushed }}" \
            "${{ steps.tags.outputs.prior }}" \
            || {
              echo "::error::release tag ${{ steps.tags.outputs.pushed }} is not strictly greater than prior ${{ steps.tags.outputs.prior }} — refusing to publish a downgrade"
              exit 1
            }

  build:
    name: build ${{ matrix.binary }} ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    needs: [version-monotonicity]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        binary: [cordum-hook, cordum-agentd, cordum-claude]
        target:
          - { goos: linux,   goarch: amd64, ext: ''     }
          - { goos: linux,   goarch: arm64, ext: ''     }
          - { goos: darwin,  goarch: amd64, ext: ''     }
          - { goos: darwin,  goarch: arm64, ext: ''     }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: '0'
          RELEASE_FINGERPRINT: ${{ secrets.RELEASE_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p bin
          out="bin/${{ matrix.binary }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}"
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/cordum/cordum/tools/sign.PinnedReleaseFingerprint=${RELEASE_FINGERPRINT:-}" \
            -o "$out" \
            ./cmd/${{ matrix.binary }}
          ls -la "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.binary }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: bin/${{ matrix.binary }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}
          retention-days: 1

  sign-darwin:
    # Tier 2 — Apple Developer ID codesign + notarytool. Canonical repo only.
    name: codesign+notarize ${{ matrix.target.goarch }}
    needs: [build]
    if: github.repository == 'cordum-io/cordum'
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goarch: amd64 }
          - { goarch: arm64 }
    steps:
      - name: Guard on secrets
        id: have_secrets
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          if [ -z "${APPLE_DEVELOPER_ID:-}" ]; then
            echo "::notice::APPLE_DEVELOPER_ID not set — skipping Tier 2 darwin signing"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.have_secrets.outputs.skip == 'false'
        with:
          pattern: bin-*-darwin-${{ matrix.target.goarch }}
          merge-multiple: true
          path: bin/
      - name: codesign + notarize
        if: steps.have_secrets.outputs.skip == 'false'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          for f in bin/cordum-*-darwin-${{ matrix.target.goarch }}; do
            codesign --sign "$APPLE_DEVELOPER_ID" --options runtime \
                     --timestamp --deep --strict "$f"
            # Notarize requires a .zip envelope for non-bundle binaries.
            zip -j "${f}.zip" "$f"
            xcrun notarytool submit "${f}.zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --wait
            # Stapling for binaries is not supported by stapler — the
            # notary record is verified online by Gatekeeper instead.
            rm -f "${f}.zip"
          done
      - uses: actions/upload-artifact@v7
        if: steps.have_secrets.outputs.skip == 'false'
        with:
          name: signed-darwin-${{ matrix.target.goarch }}
          path: bin/cordum-*-darwin-${{ matrix.target.goarch }}
          retention-days: 1

  sign-windows:
    # Tier 2 — Authenticode. Canonical repo only.
    name: authenticode windows-amd64
    needs: [build]
    if: github.repository == 'cordum-io/cordum'
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Guard on secrets
        id: have_secrets
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:WIN_CERT_PFX_BASE64) {
            Write-Host "::notice::WIN_CERT_PFX_BASE64 not set — skipping Tier 2 windows signing"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - uses: actions/download-artifact@v8
        if: steps.have_secrets.outputs.skip == 'false'
        with:
          pattern: bin-*-windows-amd64
          merge-multiple: true
          path: bin/
      - name: signtool
        if: steps.have_secrets.outputs.skip == 'false'
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASS: ${{ secrets.WIN_CERT_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'cordum-release.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [System.Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' |
                      Where-Object { $_.FullName -match 'x64\\signtool.exe$' } |
                      Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Get-ChildItem bin\cordum-*-windows-amd64.exe | ForEach-Object {
            & $signtool sign /f $pfx /p $env:WIN_CERT_PASS `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
          }
          Remove-Item -LiteralPath $pfx -Force
      - uses: actions/upload-artifact@v7
        if: steps.have_secrets.outputs.skip == 'false'
        with:
          name: signed-windows-amd64
          path: bin/cordum-*-windows-amd64.exe
          retention-days: 1

  sign-manifest:
    # Tier 1 — always-on keyless-signed SHA256SUMS manifest. Always runs on
    # ubuntu so forks without OS-native secrets still get the integrity
    # gate that install.sh + tools/sign/Verifier consume.
    name: tier1 sign manifest
    needs: [build, sign-darwin, sign-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # cosign keyless signing of SHA256SUMS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Collect (signed if available, else unsigned cross-compiled)
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Stage binaries
        run: |
          set -euo pipefail
          mkdir -p release
          # Prefer signed-* artifacts when present; fall back to bin-*.
          for d in artifacts/signed-*; do
            [ -d "$d" ] && cp -av "$d/." release/
          done
          for d in artifacts/bin-*; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              base="$(basename "$f")"
              [ -f "release/$base" ] || cp -av "$f" "release/$base"
            done
          done
          ls -la release/
      - name: Build release-qual
        run: |
          go build -trimpath -o "$RUNNER_TEMP/release-qual" ./tools/releasequal/cmd/release-qual
          echo "RELEASE_QUAL=$RUNNER_TEMP/release-qual" >> "$GITHUB_ENV"
      - name: Qualify staged binaries
        id: qualify-binaries
        env:
          DRY_RUN: ${{ startsWith(github.ref, 'refs/heads/release-dry-run/') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged=(release/cordum-*)
          names=()
          files=()
          for f in "${staged[@]}"; do
            [[ -f "$f" && ! -L "$f" ]] || { echo "::error::not a regular binary: $f"; exit 1; }
            names+=("${f##*/}")
            files+=(--file "$f")
          done
          diff <(printf '%s\n' $EXPECTED_BINARIES | sort) <(printf '%s\n' "${names[@]}" | sort)
          mkdir -p "$RUNNER_TEMP/qual"
          "$RELEASE_QUAL" entry --kind binary "${files[@]}" \
            --exception "binary-no-release-gate=$BINARY_NO_RELEASE_GATE_REASON" \
            --out "$RUNNER_TEMP/qual/entry-binaries.json"
          dry_run=()
          if [[ "$DRY_RUN" == true ]]; then dry_run=(--dry-run); fi
          "$RELEASE_QUAL" assemble --out "$RUNNER_TEMP/qual/binary-record.json" \
            --ref "$GITHUB_REF" --run-url "$RUN_URL" --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" "${dry_run[@]}" "$RUNNER_TEMP/qual/entry-binaries.json"
          "$RELEASE_QUAL" validate "$RUNNER_TEMP/qual/binary-record.json"
          "$RELEASE_QUAL" check --record "$RUNNER_TEMP/qual/binary-record.json" "${files[@]}"
      - name: Upload binary qualification entry
        uses: actions/upload-artifact@v7
        with:
          name: qual-entry-binaries
          path: ${{ runner.temp }}/qual/entry-binaries.json
          overwrite: true
          if-no-files-found: error
      - name: Build manifest-cli
        run: go build -trimpath -o release/.manifest-cli ./tools/sign/cmd/manifest-cli
      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          paths=$(find . -maxdepth 1 -type f -name 'cordum-*' | sort | sed 's|^./||')
          if [ -z "$paths" ]; then
            echo "::error::no cordum-* artefacts staged for manifest"
            exit 1
          fi
          ./.manifest-cli $paths > SHA256SUMS
          rm -f .manifest-cli
          # EDGE-151-DOWNGRADE: prepend `# version: <tag>` so install.{sh,ps1}
          # can enforce monotonic floor on the operator endpoint. A dry run
          # gets a pre-release of v0.0.0, below every real tag.
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/release-dry-run/*) tag="v0.0.0-dryrun.${GITHUB_RUN_NUMBER}" ;;
            *) echo "::error::SHA256SUMS is written only for v* tags and release-dry-run/** branches, not ${GITHUB_REF}"; exit 1 ;;
          esac
          {
            printf '# version: %s\n' "$tag"
            cat SHA256SUMS
          } > SHA256SUMS.versioned
          mv -f SHA256SUMS.versioned SHA256SUMS
          cat SHA256SUMS
      - name: Probe for Tier 1 secrets
        id: tier1_secrets
        env:
          # Pass secrets through env so step-level `if` can compare a plain
          # env var instead of a `secrets.*` expression (actionlint rejects
          # step-level `if: secrets.X != ''`).
          GPG_RELEASE_KEY_PRIVATE: ${{ secrets.GPG_RELEASE_KEY_PRIVATE }}
        run: |
          if [ -n "${GPG_RELEASE_KEY_PRIVATE:-}" ]; then
            echo "has_gpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detach-sign SHA256SUMS (Tier 1)
        if: steps.tier1_secrets.outputs.has_gpg == 'true'
        env:
          GPG_RELEASE_KEY_PRIVATE: ${{ secrets.GPG_RELEASE_KEY_PRIVATE }}
          GPG_RELEASE_KEY_PASSPHRASE: ${{ secrets.GPG_RELEASE_KEY_PASSPHRASE }}
          RELEASE_KEY_ID: ${{ secrets.RELEASE_FINGERPRINT }}
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          chmod 700 "$tmp_home"
          export GNUPGHOME="$tmp_home"
          echo "$GPG_RELEASE_KEY_PRIVATE" | gpg --batch --import
          # The release secret stores the private key in ascii-armored
          # form; allow the workflow to override --local-user with the
          # explicit fingerprint baked in via RELEASE_FINGERPRINT.
          gpg --batch --yes --quiet \
              --pinentry-mode loopback \
              --passphrase "$GPG_RELEASE_KEY_PASSPHRASE" \
              --local-user "$RELEASE_KEY_ID" \
              --detach-sign --armor \
              --output release/SHA256SUMS.asc \
              release/SHA256SUMS
          rm -rf "$tmp_home"
      - name: Banner — Tier 1 skipped
        if: steps.tier1_secrets.outputs.has_gpg == 'false'
        run: |
          echo "::notice::GPG_RELEASE_KEY_PRIVATE not set — SHA256SUMS.asc was NOT produced. The keyless SHA256SUMS.sigstore.json bundle from the next steps is this release's signature."
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # SHA256SUMS and the binaries are final from here on: nothing below
      # changes them in release/.
      - name: Sign SHA256SUMS keylessly
        id: sign-blob
        run: cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
      # install.sh's built-in identity accepts only release.yml at a v* tag of
      # cordum-io/cordum. Dry runs and forks pin this run's exact identity.
      - name: Pin the signer identity of this run
        id: pin-signer-identity
        if: github.repository != 'cordum-io/cordum' || !startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          escaped="$(printf '%s' "$identity" | sed 's|[^[:alnum:]/:@_-]|\\&|g')"
          echo "CORDUM_COSIGN_IDENTITY_REGEXP=^${escaped}\$" >> "$GITHUB_ENV"
          echo "signer identity pinned to ${identity}"
      - name: Verify the signed release with install.sh
        id: verify-release
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/verify-release.log"
          CORDUM_BINARY_FLOOR_FILE="$RUNNER_TEMP/verify-release-floor.json" \
            bash tools/scripts/install.sh --release-dir release 2>&1 | tee "$log"
          want="$(wc -w <<<"$EXPECTED_BINARIES")"
          got="$(grep -c '"event":"binary-verify-ok".*"sig_scheme":"cosign-keyless"' "$log" || true)"
          [ "$got" -eq "$want" ] || { echo "::error::install.sh verified ${got} binaries with the keyless signature, want ${want}"; exit 1; }
          grep -qxF "[install] release-dir verified: release (${want} binaries match manifest)" "$log" \
            || { echo "::error::install.sh did not report the verify-only result"; exit 1; }
          echo "VERIFY_RELEASE_OK ${got} binaries"
      - name: Refuse a tampered copy with install.sh
        id: refuse-tampered
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/refuse-tampered"
          bin=cordum-hook-linux-amd64
          mkdir -p "$work/install"
          cp -a release "$work/release"
          # One changed byte in one binary; SHA256SUMS and its bundle stay as signed.
          printf 'X' | dd of="$work/release/$bin" bs=1 count=1 conv=notrunc status=none
          changed="$(cmp -l "release/$bin" "$work/release/$bin" | wc -l || true)"
          [ "$changed" -eq 1 ] || { echo "::error::want one changed byte in $bin, got ${changed}"; exit 1; }
          rc=0
          CORDUM_BINARY_FLOOR_FILE="$work/floor.json" \
            bash tools/scripts/install.sh --release-dir "$work/release" --install-dir "$work/install" >"$work/out.log" 2>&1 || rc=$?
          cat "$work/out.log"
          [ "$rc" -ne 0 ] || { echo "::error::install.sh accepted a copy with a changed $bin"; exit 1; }
          grep -qxF "BINARY-VERIFY-FAIL: hash mismatch $bin" "$work/out.log" \
            || { echo "::error::install.sh refused the copy for another reason"; exit 1; }
          [ -z "$(ls -A "$work/install")" ] || { echo "::error::install dir is not empty"; exit 1; }
          [ ! -e "$work/floor.json" ] || { echo "::error::install.sh wrote a version floor"; exit 1; }
          echo "REFUSE_TAMPERED_OK $bin rc=${rc}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            release/cordum-*
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json
            release/SHA256SUMS.asc
          if-no-files-found: error
          retention-days: 7
