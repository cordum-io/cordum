# Build, gate and publish the release images, then the Helm chart.
#
# Triggers:
#   - A v* tag push publishes the release: git tag v0.9.3 && git push --tags
#   - A push to a release-dry-run/** branch runs the same image and record
#     jobs against a registry local to each job (localhost:5000). It skips the
#     registry logins, Docker Hub, cosign, the SARIF upload, issue creation,
#     the published-image smoke and the Helm chart push.
#
# Each image job builds its multi-arch image once and pushes it by digest,
# without tags. The smoke check and the Trivy OS scan run against that pushed
# digest. The job then writes a release-qual entry for the digest, signs it
# (v* tags only) and applies the release tags, each through
# `release-qual publish`, and fails unless every tag resolves to the digest.
# The qualification-record job assembles the entries into one record and
# uploads it as the `qualification-record` workflow artifact.
#
# Required GitHub Secrets (v* tags only):
#   DOCKERHUB_USERNAME  — Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (PAT)
#
# Published artifacts:
#   Docker Hub: cordum/api-gateway:0.9.3, cordum/scheduler:0.9.3, ...
#   GHCR:       ghcr.io/cordum-io/cordum/api-gateway:0.9.3, ...
#   Helm (OCI): ghcr.io/cordum-io/cordum/charts/cordum:0.9.3

name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-dry-run/**"

# Serialize tag-triggered runs per ref so two concurrent pushes (or a
# re-run while the previous run is still finishing) cannot race on the
# :latest tag in any registry. cancel-in-progress is false because a
# half-pushed multi-arch image would leave an inconsistent manifest.
concurrency:
  group: docker-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write  # cosign keyless signing
  security-events: write  # Trivy SARIF upload
  issues: write           # smoke-test failure auto-issue

# Exception reasons for the qualification record. They live here because
# release-qual assemble refuses one exception id with two different reasons.
# The image jobs share their steps through YAML anchors (&name) and aliases
# (*name), so the three jobs cannot drift apart.
env:
  QUAL_REASON_NON_AMD64: "The smoke check and the Trivy OS scan ran on the linux/amd64 variant of this image index only; the linux/arm64 variant was not gated."
  QUAL_REASON_PRODUCTION_GATE: "The production gate (tools/scripts/production_gate.sh) runs against a source-built stack and did not run against these release digests."
  QUAL_REASON_TRIVY_OS_ONLY: "The Trivy gate fails on fixed OS-package findings at any severity (SARIF without limit-severities-for-sarif); unfixed findings are ignored (ignore-unfixed), and application dependencies such as Go modules and npm packages are not scanned (vuln-type os)."

jobs:
  control-plane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            service: cordum-api-gateway
          - name: scheduler
            service: cordum-scheduler
          - name: safety-kernel
            service: cordum-safety-kernel
          - name: workflow-engine
            service: cordum-workflow-engine
          - name: context-engine
            service: cordum-context-engine
          - name: mcp
            service: cordum-mcp
    env:
      IMAGE_NAME: ${{ matrix.name }}
      # Only the control-plane entries carry this exception.
      QUAL_REASON_CONTROL_PLANE_SMOKE: "The control-plane smoke check tolerates a failing service binary; it fails only when the image cannot be pulled or cannot run a shell."
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - &select-registries
        name: Select release registries
        id: registries
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              primary="ghcr.io/cordum-io/cordum/${IMAGE_NAME}"
              mirror="docker.io/cordum/${IMAGE_NAME}" ;;
            refs/heads/release-dry-run/*)
              primary="localhost:5000/cordum-io/cordum/${IMAGE_NAME}"
              mirror="localhost:5000/cordum/${IMAGE_NAME}" ;;
            *)
              echo "::error::docker.yml publishes only from v* tags and release-dry-run/** branches, not ${GITHUB_REF}"
              exit 1 ;;
          esac
          echo "IMAGE_PRIMARY=${primary}" >> "$GITHUB_ENV"
          echo "IMAGE_MIRROR=${mirror}" >> "$GITHUB_ENV"
          echo "IMAGE_PRIMARY=${primary} IMAGE_MIRROR=${mirror}"

      - &dry-run-registry
        name: Start job-local registry (dry run)
        if: startsWith(github.ref, 'refs/heads/release-dry-run/')
        run: |
          set -euo pipefail
          docker run -d --name release-dry-run-registry -p 5000:5000 registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:5000/v2/; then echo "job-local registry is up"; exit 0; fi
            sleep 1
          done
          docker logs release-dry-run-registry || true
          echo "::error::job-local registry did not answer on localhost:5000 within 30 s"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - &setup-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Lets BuildKit reach the dry-run registry on localhost:5000; the
          # release builder is the same, and registry pushes are unaffected.
          driver-opts: network=host

      - &login-ghcr
        name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - &login-dockerhub
        name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - &setup-go
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - &build-release-qual
        name: Build release-qual
        run: |
          go build -o "$RUNNER_TEMP/release-qual" ./tools/releasequal/cmd/release-qual
          echo "RELEASE_QUAL=$RUNNER_TEMP/release-qual" >> "$GITHUB_ENV"

      - &docker-meta
        name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_PRIMARY }}
            ${{ env.IMAGE_MIRROR }}
          # :latest only moves on final release tags. Pre-release suffixes
          # (v1.0.0-rc.1, -beta, -alpha) must NEVER overwrite :latest —
          # that's the single most common way to ship a production-unsafe
          # image by accident. A dry run also gets dry-run-<run id>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
            type=raw,value=dry-run-${{ github.run_id }},enable=${{ startsWith(github.ref, 'refs/heads/release-dry-run/') }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.IMAGE_PRIMARY }},${{ env.IMAGE_MIRROR }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Smoke-check the pushed digest
        id: smoke
        env:
          IMAGE_REF: ${{ env.IMAGE_PRIMARY }}@${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_REF##*@}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pushed digest in ${IMAGE_REF}"; exit 1; }
          echo "GATE image-smoke START ${IMAGE_REF}"
          docker run --rm "$IMAGE_REF" --version || docker run --rm "$IMAGE_REF" version || echo "No --version flag"
          docker run --rm --entrypoint sh "$IMAGE_REF" -c "ls -la /usr/local/bin/${{ matrix.service }} 2>/dev/null || ls -la /app/${{ matrix.service }} 2>/dev/null || echo 'binary ok'"
          echo "GATE image-smoke PASS ${IMAGE_REF}"

      - &trivy
        name: Scan the pushed digest (Trivy)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_PRIMARY }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ env.IMAGE_NAME }}.sarif
          # SARIF without limit-severities-for-sarif unsets the severity
          # filter: any fixed OS-package finding fails the job. Unfixed
          # findings are ignored, and application dependencies are not scanned.
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os

      - &upload-sarif
        name: Upload Trivy SARIF
        if: always() && startsWith(github.ref, 'refs/tags/v') && hashFiles(format('trivy-{0}.sarif', env.IMAGE_NAME)) != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-${{ env.IMAGE_NAME }}.sarif
          category: trivy-${{ env.IMAGE_NAME }}

      - &write-entry
        name: Write qualification entry
        id: entry
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          JOB_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$JOB_LOG_URL" =~ /job/[0-9]+$ ]] || { echo "::error::job log URL ${JOB_LOG_URL} names no job"; exit 1; }
          mkdir -p "$RUNNER_TEMP/qual"
          smoke_exception=()
          if [[ -n "${QUAL_REASON_CONTROL_PLANE_SMOKE:-}" ]]; then
            smoke_exception=(--exception control-plane-smoke-shell-only="$QUAL_REASON_CONTROL_PLANE_SMOKE")
          fi
          "$RELEASE_QUAL" entry --kind image --name "$IMAGE_NAME" --ref "$IMAGE_PRIMARY" --digest "$DIGEST" \
            --gate image-smoke=pass --gate trivy-os-linux-amd64=pass --log "$JOB_LOG_URL" \
            --exception non-amd64-variant-not-gated="$QUAL_REASON_NON_AMD64" \
            --exception production-gate-not-digest-bound="$QUAL_REASON_PRODUCTION_GATE" \
            --exception trivy-os-packages-only="$QUAL_REASON_TRIVY_OS_ONLY" \
            "${smoke_exception[@]}" \
            --out "$RUNNER_TEMP/qual/entry-$IMAGE_NAME.json"
          dry_run=()
          if [[ "$GITHUB_REF" == refs/heads/release-dry-run/* ]]; then
            dry_run=(--dry-run)
          fi
          "$RELEASE_QUAL" assemble --out "$RUNNER_TEMP/qual/job-record.json" --ref "$GITHUB_REF" --run-url "$RUN_URL" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" "${dry_run[@]}" "$RUNNER_TEMP/qual/entry-$IMAGE_NAME.json"
          "$RELEASE_QUAL" validate "$RUNNER_TEMP/qual/job-record.json"

      - &upload-entry
        name: Upload qualification entry
        uses: actions/upload-artifact@v7
        with:
          name: qual-entry-${{ env.IMAGE_NAME }}
          path: ${{ runner.temp }}/qual/entry-${{ env.IMAGE_NAME }}.json
          if-no-files-found: error
          overwrite: true

      - &install-cosign
        name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signing precedes tagging, so no release tag points at an unsigned digest.
      - &sign
        name: Sign the qualified digest
        id: sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for repo in "$IMAGE_PRIMARY" "$IMAGE_MIRROR"; do
            "$RELEASE_QUAL" publish --record "$RUNNER_TEMP/qual/job-record.json" --artifact "${IMAGE_NAME}=${DIGEST}" -- cosign sign --yes "${repo}@${DIGEST}"
          done

      - &publish-tags
        name: Publish release tags
        id: publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/release-dry-run/* ]]; then
            for repo in "$IMAGE_PRIMARY" "$IMAGE_MIRROR"; do
              code="$(curl -sS -o "$RUNNER_TEMP/tags.json" -w '%{http_code}' "http://localhost:5000/v2/${repo#localhost:5000/}/tags/list")"
              tags='[]'
              if [[ "$code" == 200 ]]; then tags="$(jq -c '.tags // []' "$RUNNER_TEMP/tags.json")"; elif [[ "$code" != 404 ]]; then exit 1; fi
              echo "PRE_PUBLISH_TAGS ${repo} ${tags}"
              [[ "$tags" == '[]' ]] || { echo "::error::${repo} has tags before release-qual publish"; exit 1; }
            done
          fi
          mapfile -t tags <<< "$TAGS"
          published=0
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] || continue
            "$RELEASE_QUAL" publish --record "$RUNNER_TEMP/qual/job-record.json" --artifact "${IMAGE_NAME}=${DIGEST}" -- docker buildx imagetools create --tag "$tag" "${tag%:*}@${DIGEST}"
            published=$((published + 1))
          done
          (( published > 0 )) || { echo "::error::docker/metadata-action rendered no tag"; exit 1; }

      - &verify-tags
        name: Verify published tags
        id: verify-tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] || continue
            got="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$got" == "$DIGEST" ]] || { echo "::error::${tag} resolves to ${got}, not the qualified ${DIGEST}"; exit 1; }
            echo "TAG_OK ${tag} ${got}"
          done

  dashboard:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - *select-registries
      - *dry-run-registry

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - *setup-buildx
      - *login-ghcr
      - *login-dockerhub
      - *setup-go
      - *build-release-qual
      - *docker-meta

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          # Multi-arch for parity with the control-plane images. The
          # upstream node and nginx-unprivileged alpine bases are both
          # multi-arch so no Dockerfile changes are required. The smoke check
          # below runs the amd64 variant on the amd64 runner — cross-arch
          # docker run needs QEMU *execution* support which we don't
          # install, so it stays amd64-only by design.
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.IMAGE_PRIMARY }},${{ env.IMAGE_MIRROR }}",push-by-digest=true,name-canonical=true,push=true

      - name: Smoke-check the pushed digest
        id: smoke
        env:
          IMAGE_REF: ${{ env.IMAGE_PRIMARY }}@${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_REF##*@}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pushed digest in ${IMAGE_REF}"; exit 1; }
          echo "GATE image-smoke START ${IMAGE_REF}"
          echo "Verifying $IMAGE_REF responds on port 8080..."
          docker run -d --name dash-verify -p 18080:8080 --add-host cordum-api-gateway:127.0.0.1 "$IMAGE_REF"
          sleep 3
          if curl -sf http://localhost:18080/healthz > /dev/null 2>&1; then
            echo "Dashboard image verified"
          else
            echo "Dashboard image failed health check"
            docker logs dash-verify
            docker stop dash-verify && docker rm dash-verify
            exit 1
          fi
          docker stop dash-verify && docker rm dash-verify
          echo "GATE image-smoke PASS ${IMAGE_REF}"

      - *trivy
      - *upload-sarif
      - *write-entry
      - *upload-entry
      - *install-cosign
      - *sign
      - *publish-tags
      - *verify-tags

  # Greeter for the demo-quickstart pack. Built from a dedicated Dockerfile
  # under demo/quickstart/, hence its own job rather than a control-plane
  # matrix entry. Same publishing posture as core images: multi-arch,
  # cosign-signed, SBOM + provenance.
  demo-quickstart-worker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: demo-quickstart-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - *select-registries
      - *dry-run-registry

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - *setup-buildx
      - *login-ghcr
      - *login-dockerhub
      - *setup-go
      - *build-release-qual
      - *docker-meta

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/quickstart/Dockerfile
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.IMAGE_PRIMARY }},${{ env.IMAGE_MIRROR }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Smoke-check the pushed digest
        id: smoke
        env:
          IMAGE_REF: ${{ env.IMAGE_PRIMARY }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REF##*@}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pushed digest in ${IMAGE_REF}"; exit 1; }
          echo "GATE image-smoke START ${IMAGE_REF}"
          # The greeter exits with no work to do when no NATS server is
          # reachable; log inspection is the right boot probe here.
          docker run --rm --entrypoint sh "$IMAGE_REF" -c \
            "test -x /usr/local/bin/demo-quickstart-worker && echo 'binary ok'"
          echo "GATE image-smoke PASS ${IMAGE_REF}"

      - *trivy
      - *upload-sarif
      - *write-entry
      - *upload-entry
      - *install-cosign
      - *sign
      - *publish-tags
      - *verify-tags

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    secrets: inherit

  binaries-dry-run:
    if: startsWith(github.ref, 'refs/heads/release-dry-run/')
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml

  # One record for the run: image and binary entries, assembled and validated.
  qualification-record:
    needs: [control-plane, dashboard, demo-quickstart-worker, binaries, binaries-dry-run]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_IMAGES: "api-gateway context-engine dashboard demo-quickstart-worker mcp safety-kernel scheduler workflow-engine"
      EXPECTED_BINARIES: >-
        cordum-agentd-darwin-amd64 cordum-agentd-darwin-arm64 cordum-agentd-linux-amd64
        cordum-agentd-linux-arm64 cordum-agentd-windows-amd64.exe cordum-claude-darwin-amd64
        cordum-claude-darwin-arm64 cordum-claude-linux-amd64 cordum-claude-linux-arm64
        cordum-claude-windows-amd64.exe cordum-hook-darwin-amd64 cordum-hook-darwin-arm64
        cordum-hook-linux-amd64 cordum-hook-linux-arm64 cordum-hook-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release-qual
        run: |
          go build -o "$RUNNER_TEMP/release-qual" ./tools/releasequal/cmd/release-qual
          echo "RELEASE_QUAL=$RUNNER_TEMP/release-qual" >> "$GITHUB_ENV"

      - name: Download qualification entries
        uses: actions/download-artifact@v8
        with:
          pattern: qual-entry-*
          merge-multiple: true
          path: ${{ runner.temp }}/qual-entries

      - name: Assemble and validate the record
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=("$RUNNER_TEMP"/qual-entries/entry-*.json)
          (( ${#entries[@]} > 0 )) || { echo "::error::no qualification entries were downloaded"; exit 1; }
          dry_run=()
          if [[ "$GITHUB_REF" == refs/heads/release-dry-run/* ]]; then
            dry_run=(--dry-run)
          fi
          record="$RUNNER_TEMP/qualification-record.json"
          "$RELEASE_QUAL" assemble --out "$record" --ref "$GITHUB_REF" --run-url "$RUN_URL" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" "${dry_run[@]}" "${entries[@]}"
          "$RELEASE_QUAL" validate "$record"
          got="$(jq -r '[.artifacts[] | select(.kind == "image") | .name] | sort | join(" ")' "$record")"
          [[ "$got" == "$EXPECTED_IMAGES" ]] || { echo "::error::record images [${got}] are not EXPECTED_IMAGES [${EXPECTED_IMAGES}]"; exit 1; }
          got="$(jq -r '[.artifacts[] | select(.kind == "binary") | .name] | sort | join(" ")' "$record")"
          [[ "$got" == "$EXPECTED_BINARIES" ]] || { echo "::error::record binaries [${got}] are not EXPECTED_BINARIES [${EXPECTED_BINARIES}]"; exit 1; }
          jq -r '.artifacts[] | "\(.kind) \(.name) \(.digest)"' "$record"

      - name: Upload qualification record
        uses: actions/upload-artifact@v7
        with:
          name: qualification-record
          path: ${{ runner.temp }}/qualification-record.json
          if-no-files-found: error
          overwrite: true

  publish-binaries:
    name: Publish Edge binaries
    needs: [binaries, qualification-record]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release-qual
        run: |
          go build -trimpath -o "$RUNNER_TEMP/release-qual" ./tools/releasequal/cmd/release-qual
          echo "RELEASE_QUAL=$RUNNER_TEMP/release-qual" >> "$GITHUB_ENV"
      - name: Download staged binaries
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release/
      - name: Download qualification record
        uses: actions/download-artifact@v8
        with:
          name: qualification-record
          path: ${{ runner.temp }}
      - name: Require signed manifest on canonical release
        if: github.repository == 'cordum-io/cordum'
        run: |
          set -euo pipefail
          if [ ! -f release/SHA256SUMS.asc ]; then
            echo "::error::canonical release tag ${GITHUB_REF#refs/tags/} requires a signed SHA256SUMS.asc; sign-manifest job did not produce one (GPG_RELEASE_KEY_PRIVATE missing or signing failed). Refusing to publish an unsigned release."
            exit 1
          fi
          if [ ! -f release/SHA256SUMS ]; then
            echo "::error::release/SHA256SUMS missing"
            exit 1
          fi
      - name: Create release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          assets=()
          files=()
          for f in release/cordum-*; do
            [[ -f "$f" && ! -L "$f" ]] || { echo "::error::not a regular binary: $f"; exit 1; }
            files+=(--file "$f")
            assets+=("$f")
          done
          (( ${#files[@]} > 0 )) || { echo "::error::no binaries staged"; exit 1; }
          for f in release/SHA256SUMS release/SHA256SUMS.asc; do
            [ ! -f "$f" ] || assets+=("$f")
          done
          "$RELEASE_QUAL" publish --record "$RUNNER_TEMP/qualification-record.json" "${files[@]}" -- gh release create "$tag" \
            --title "$tag" \
            --notes "Cordum desktop binaries for $tag. Verify via SHA256SUMS + SHA256SUMS.asc — see docs/security/binary-signing.md." \
            "${assets[@]}"

  smoke-published-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [control-plane, dashboard, demo-quickstart-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pull and smoke each published image
        id: smoke
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Strip leading 'v' from semver tags so the image tag matches what
          # docker/metadata-action emitted (type=semver,pattern={{version}}).
          IMAGE_TAG="${TAG#v}"
          echo "Verifying images at ghcr.io/cordum-io/cordum/*:${IMAGE_TAG}"

          control_plane=(api-gateway scheduler safety-kernel workflow-engine context-engine mcp)
          failed=()
          for name in "${control_plane[@]}" dashboard demo-quickstart-worker; do
            image="ghcr.io/cordum-io/cordum/${name}:${IMAGE_TAG}"
            echo "::group::pull ${image}"
            if ! docker pull "${image}"; then
              echo "FAIL: docker pull ${image}"
              failed+=("${name}: pull failed")
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"

            echo "::group::smoke ${image}"
            # demo-quickstart-worker is a long-running NATS subscriber and
            # has no --help; the binary's mere presence is sufficient as a
            # post-pull smoke (the integration test hits the real workflow).
            if [[ "${name}" == "demo-quickstart-worker" ]]; then
              if ! docker run --rm --entrypoint sh "${image}" -c "test -x /usr/local/bin/demo-quickstart-worker"; then
                failed+=("${name}: binary missing from image")
              fi
              echo "::endgroup::"
              continue
            fi
            # dashboard is an nginx container — boot probe rather than --help.
            if [[ "${name}" == "dashboard" ]]; then
              if ! docker run -d --name "smoke-${name}" -p 18080:8080 "${image}"; then
                failed+=("${name}: container failed to start")
              else
                sleep 3
                if ! curl -sf http://localhost:18080/healthz >/dev/null 2>&1; then
                  failed+=("${name}: /healthz did not respond")
                  docker logs "smoke-${name}" || true
                fi
                docker rm -f "smoke-${name}" >/dev/null 2>&1 || true
              fi
            else
              # Control-plane images are long-running services built from the
              # shared root Dockerfile, which installs the selected service as
              # /usr/local/bin/app. They are not CLI tools and may correctly
              # reject --help/version without their runtime config. A post-pull
              # smoke should verify that the image starts a shell and contains
              # the expected executable. Service boot is not covered here, nor
              # by the image job's smoke check; the qualification record lists
              # that as the control-plane-smoke-shell-only exception.
              if ! docker run --rm --entrypoint sh "${image}" -c "test -x /usr/local/bin/app"; then
                failed+=("${name}: /usr/local/bin/app missing or not executable")
              fi
            fi
            echo "::endgroup::"
          done

          if (( ${#failed[@]} > 0 )); then
            printf 'SMOKE FAILED:\n' >&2
            printf '  - %s\n' "${failed[@]}" >&2
            {
              echo "tag=${TAG}"
              echo "failed<<EOF"
              printf '  - %s\n' "${failed[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All published images smoke-passed."

      - name: Open release-break issue on failure
        if: failure() && steps.smoke.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          FAILED: ${{ steps.smoke.outputs.failed }}
        run: |
          set -euo pipefail
          body=$(printf 'Release smoke test failed for **%s**.\n\nFailures:\n%s\n\nWorkflow run: %s/%s/actions/runs/%s' \
            "${TAG}" "${FAILED}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")
          gh label create release-break \
            --repo "${GITHUB_REPOSITORY}" \
            --color D73A4A \
            --description "Release smoke test failure" >/dev/null 2>&1 || true
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "release-break: ${TAG} smoke test failed" \
            --label "release-break" \
            --body "${body}" || \
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "release-break: ${TAG} smoke test failed" \
            --body "${body}"

  helm-chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-published-images, qualification-record]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Login to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update chart version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" cordum-helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" cordum-helm/Chart.yaml
          # Keep the packaged chart default image tag aligned with the images
          # published by docker/metadata-action (semver tag without the leading v).
          sed -i -E "/^global:/,/^secrets:/ s/^([[:space:]]+tag: ).*/\1\"${VERSION}\"/" cordum-helm/values.yaml
          echo "Chart version and default image tag set to ${VERSION}"
          grep -E '^(version|appVersion):' cordum-helm/Chart.yaml
          sed -n '/^global:/,/^secrets:/p' cordum-helm/values.yaml | grep -E '^[[:space:]]+tag:'

      - name: Update image tags in Artifact Hub annotations
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Update image tags in artifacthub.io/images annotations (format: image:TAG)
          sed -i -E "s|(ghcr\.io/cordum-io/cordum/[a-z-]+:)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|g" cordum-helm/Chart.yaml
          echo "Image tags updated to ${VERSION}"
          grep "image:" cordum-helm/Chart.yaml

      - name: Lint chart
        run: helm lint cordum-helm/

      - name: Package chart
        run: |
          helm package cordum-helm/ --destination /tmp/charts
          ls -la /tmp/charts/

      - name: Push chart to GHCR (OCI)
        run: |
          helm push /tmp/charts/cordum-*.tgz oci://ghcr.io/cordum-io/cordum/charts
          echo "Helm chart pushed to oci://ghcr.io/cordum-io/cordum/charts/cordum"
