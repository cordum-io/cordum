# Template: Secret Scan (input rule)
# Denies any agent input that carries credentials, API keys, or private keys.
# A hard-deny rule because leaked secrets are not recoverable — once they
# pass downstream they may be logged, cached, or sent over the wire.
id: ""
name: Secret scan
type: input
scope:
  kind: global
status: draft
version: v1
description: >-
  Hard-denies agent input that triggers any secret scanner (API keys, JWT
  tokens, private keys). Secret leakage is not recoverable downstream.
match:
  scanners: [secrets, regex]
  content_patterns:
    - "AKIA[0-9A-Z]{16}"
    - "ghp_[A-Za-z0-9]{36}"
    - "-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----"
decide:
  type: deny
  severity: high
  reason: "Secret detected in input payload."
